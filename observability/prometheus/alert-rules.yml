groups:
  - name: leaf_infrastructure
    interval: 30s
    rules:
      # CPU Alert
      - alert: HighCPUUsage
        expr: rate(process_cpu_user_seconds_total[5m]) + rate(process_cpu_system_seconds_total[5m]) > 0.70
        for: 5m
        labels:
          severity: warning
          service: leaf-backend
        annotations:
          summary: "CPU usage is high"
          description: "CPU usage is above 70% for more than 5 minutes. Current value: {{ $value }}"

      - alert: CriticalCPUUsage
        expr: rate(process_cpu_user_seconds_total[5m]) + rate(process_cpu_system_seconds_total[5m]) > 0.85
        for: 2m
        labels:
          severity: critical
          service: leaf-backend
        annotations:
          summary: "CPU usage is critical"
          description: "CPU usage is above 85% for more than 2 minutes. Current value: {{ $value }}"

      # Memory Alert
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / (1024 * 1024 * 1024)) > 2.5
        for: 5m
        labels:
          severity: warning
          service: leaf-backend
        annotations:
          summary: "Memory usage is high"
          description: "Memory usage is above 2.5GB for more than 5 minutes. Current value: {{ $value }}GB"

      - alert: CriticalMemoryUsage
        expr: (process_resident_memory_bytes / (1024 * 1024 * 1024)) > 3.0
        for: 2m
        labels:
          severity: critical
          service: leaf-backend
        annotations:
          summary: "Memory usage is critical"
          description: "Memory usage is above 3.0GB for more than 2 minutes. Current value: {{ $value }}GB"

      # WebSocket Connections Alert
      - alert: HighWebSocketConnections
        expr: sum(leaf_websocket_connections_current) > 7000
        for: 5m
        labels:
          severity: warning
          service: leaf-backend
        annotations:
          summary: "WebSocket connections are high"
          description: "WebSocket connections are above 7000 for more than 5 minutes. Current value: {{ $value }}"

      - alert: CriticalWebSocketConnections
        expr: sum(leaf_websocket_connections_current) > 8000
        for: 2m
        labels:
          severity: critical
          service: leaf-backend
        annotations:
          summary: "WebSocket connections are critical"
          description: "WebSocket connections are above 8000 for more than 2 minutes. Current value: {{ $value }}"

      # Redis Latency Alert
      - alert: HighRedisLatency
        expr: histogram_quantile(0.95, rate(leaf_redis_duration_seconds_bucket[5m])) > 0.3
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis latency is high"
          description: "Redis P95 latency is above 300ms for more than 5 minutes. Current value: {{ $value }}s"

      - alert: CriticalRedisLatency
        expr: histogram_quantile(0.95, rate(leaf_redis_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis latency is critical"
          description: "Redis P95 latency is above 500ms for more than 2 minutes. Current value: {{ $value }}s"

      # Redis Errors Alert
      - alert: HighRedisErrorRate
        expr: rate(leaf_redis_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis error rate is high"
          description: "Redis error rate is above 10 errors/sec for more than 5 minutes. Current value: {{ $value }}"

      # Event Backlog Alert
      - alert: HighEventBacklog
        expr: leaf_event_backlog > 1000
        for: 5m
        labels:
          severity: warning
          service: leaf-backend
        annotations:
          summary: "Event backlog is high"
          description: "Event backlog is above 1000 events for more than 5 minutes. Current value: {{ $value }}"

      - alert: CriticalEventBacklog
        expr: leaf_event_backlog > 5000
        for: 2m
        labels:
          severity: critical
          service: leaf-backend
        annotations:
          summary: "Event backlog is critical"
          description: "Event backlog is above 5000 events for more than 2 minutes. Current value: {{ $value }}"

  - name: leaf_business
    interval: 30s
    rules:
      # Command Failure Rate Alert
      - alert: HighCommandFailureRate
        expr: sum(rate(leaf_command_total{status="failure"}[5m])) / clamp_min(sum(rate(leaf_command_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: warning
          service: leaf-backend
        annotations:
          summary: "Command failure rate is high"
          description: "Command failure rate is above 1% for more than 5 minutes. Current value: {{ $value | humanizePercentage }}"

      - alert: CriticalCommandFailureRate
        expr: sum(rate(leaf_command_total{status="failure"}[5m])) / clamp_min(sum(rate(leaf_command_total[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: critical
          service: leaf-backend
        annotations:
          summary: "Command failure rate is critical"
          description: "Command failure rate is above 5% for more than 2 minutes. Current value: {{ $value | humanizePercentage }}"

      # Payment Failure Alert
      - alert: PaymentProcessingFailure
        expr: sum(rate(leaf_command_total{command_name=~"CompleteTrip|EndRideWithReview",status="failure"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          service: payment
        annotations:
          summary: "Payment processing failures detected"
          description: "Payment processing failures are above 0.1/sec for more than 5 minutes. Current value: {{ $value }}"

      # Listener Lag Alert
      - alert: HighListenerLag
        expr: histogram_quantile(0.95, sum by (le) (rate(leaf_event_lag_seconds_bucket[5m]))) > 30
        for: 5m
        labels:
          severity: warning
          service: leaf-backend
        annotations:
          summary: "Listener lag is high"
          description: "Listener lag is above 30 seconds for more than 5 minutes. Current value: {{ $value }}s"

      - alert: CriticalListenerLag
        expr: histogram_quantile(0.95, sum by (le) (rate(leaf_event_lag_seconds_bucket[5m]))) > 60
        for: 2m
        labels:
          severity: critical
          service: leaf-backend
        annotations:
          summary: "Listener lag is critical"
          description: "Listener lag is above 60 seconds for more than 2 minutes. Current value: {{ $value }}s"

      - alert: HighRideCostAverage
        expr: leaf_ride_cost_recent_average_brl > 0.20
        for: 5m
        labels:
          severity: warning
          service: ride-cost-monitor
        annotations:
          summary: "Average ride cost is high"
          description: "Recent average variable cost per completed ride is above R$0.20 for more than 5 minutes. Current value: R$ {{ $value }}. Woovi is excluded."
          threshold: "0.20 BRL/ride"

      - alert: CriticalRideCostAverage
        expr: leaf_ride_cost_recent_average_brl > 0.30
        for: 2m
        labels:
          severity: critical
          service: ride-cost-monitor
        annotations:
          summary: "Average ride cost is critical"
          description: "Recent average variable cost per completed ride is above R$0.30 for more than 2 minutes. Current value: R$ {{ $value }}. Woovi is excluded."
          threshold: "0.30 BRL/ride"

      - alert: HighGoogleDirectionsPerRide
        expr: leaf_ride_cost_recent_directions_per_ride > 2.2
        for: 5m
        labels:
          severity: warning
          service: maps
        annotations:
          summary: "Google Directions per ride is high"
          description: "Recent average Directions calls per completed ride is above 2.2 for more than 5 minutes. Current value: {{ $value }}."
          threshold: "2.2 req/ride"

      - alert: CriticalGoogleDirectionsPerRide
        expr: leaf_ride_cost_recent_directions_per_ride > 3
        for: 2m
        labels:
          severity: critical
          service: maps
        annotations:
          summary: "Google Directions per ride is critical"
          description: "Recent average Directions calls per completed ride is above 3 for more than 2 minutes. Current value: {{ $value }}."
          threshold: "3 req/ride"

  - name: leaf_availability
    interval: 30s
    rules:
      # Service Down Alert
      - alert: ServiceDown
        expr: up{job="leaf-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: leaf-backend
        annotations:
          summary: "Service is down"
          description: "Leaf backend service is down for more than 1 minute"

      # High Error Rate Alert
      - alert: HighErrorRate
        expr: sum(rate(leaf_command_total{status="failure"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: leaf-backend
        annotations:
          summary: "Error rate is high"
          description: "Error rate is above 5 errors/sec for more than 5 minutes. Current value: {{ $value }}"

  - name: leaf_solo_operations
    interval: 30s
    rules:
      - alert: CriticalEventLoopLag
        expr: leaf_event_loop_lag_p95_ms > 500
        for: 2m
        labels:
          severity: critical
          service: leaf-backend
        annotations:
          summary: "Event loop lag is critical"
          description: "Node.js event loop P95 lag is above 500ms for more than 2 minutes. Current value: {{ $value }}ms"
          threshold: "500"

      - alert: NoActiveWorkers
        expr: sum(leaf_workers_active) == 0
        for: 2m
        labels:
          severity: critical
          service: leaf-workers
        annotations:
          summary: "No active Leaf workers"
          description: "No active queue workers were reported for more than 2 minutes."
          threshold: "1"

      - alert: RideHealthStuckDetected
        expr: sum(leaf_ride_health_stuck_total) > 0
        for: 1m
        labels:
          severity: critical
          service: ride-lifecycle
        annotations:
          summary: "Stuck ride detected"
          description: "Ride health monitor detected one or more stuck rides. Current value: {{ $value }}"
          threshold: "0"

      - alert: H3MapComputeSlow
        expr: histogram_quantile(0.95, sum(rate(leaf_h3_cells_compute_ms_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          severity: warning
          service: maps
        annotations:
          summary: "H3 map computation is slow"
          description: "H3 map computation P95 is above 1000ms for more than 5 minutes. Current value: {{ $value }}ms"
          threshold: "1000"
