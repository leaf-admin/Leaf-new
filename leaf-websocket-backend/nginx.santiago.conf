# Santiago realtime host: two gateways, no dashboard (the dashboard stays on the
# support host). Derived from nginx.multi-gateway.conf.
user nginx;
worker_processes auto;
worker_rlimit_nofile 262144;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # During the cutover the old host forwards stragglers over WireGuard:
    # take the client address from its X-Forwarded-For, so rate limits and
    # allowlists keep seeing the real client.
    set_real_ip_from 10.77.0.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Behind the Vultr load balancer (listeners 8080/8443, PROXY protocol, bound
    # to the VPC only) the client address comes in the PROXY header. Everywhere
    # else it is $remote_addr. The gateways get exactly this one address in
    # X-Real-IP and X-Forwarded-For, so a client-sent X-Forwarded-For can no
    # longer spoof the rate limits that read its first entry.
    map $proxy_protocol_addr $leaf_client_addr {
        ''      $remote_addr;
        default $proxy_protocol_addr;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream leaf_ocr {
        # OCR worker on the support host, over WireGuard. If it is down, the
        # gateways still serve /api/ocr in-process.
        server 10.77.0.2:3110 max_fails=2 fail_timeout=30s;
        server websocket:3001 backup;
        server websocket-gateway-2:3001 backup;
        keepalive 4;
    }

    upstream leaf_backend {
        least_conn;
        # Gateways: the deploy rewrites this file to take one gateway out at a time
        # (scripts/deploy-contabo-docker.sh, NGINX_UPSTREAM_FILE).
        include /etc/nginx/leaf.d/upstream-leaf-backend.conf;
        keepalive 128;
    }

    server {
        listen 80 default_server;
        listen 8080 proxy_protocol;
        server_name leaf.app.br api.leaf.app.br socket.leaf.app.br _;

        access_log /var/log/nginx/leaf-access.log main;
        error_log /var/log/nginx/leaf-error.log warn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            access_log off;
        }

        location /health {
            proxy_pass http://leaf_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            access_log off;
        }

        location /graphql {
            proxy_pass http://leaf_backend/graphql;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://leaf_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
            proxy_buffering off;
        }

        location /api/woovi/webhook {
            proxy_pass http://leaf_backend/api/woovi/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    server {
        listen 443 ssl default_server;
        listen 8443 ssl proxy_protocol;
        http2 on;
        server_name api.leaf.app.br socket.leaf.app.br;

        ssl_certificate /etc/letsencrypt/live/api.leaf.app.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.leaf.app.br/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;

        access_log /var/log/nginx/leaf-access-leaf-ssl.log main;
        error_log /var/log/nginx/leaf-error-leaf-ssl.log warn;

        # Host health summary for the external uptime monitor
        # (scripts/ops/host-health-report.py, leaf-host-health.timer).
        location = /health/host {
            default_type application/json;
            alias /var/www/certbot/leaf-host-health.json;
            add_header Cache-Control "no-store" always;
            access_log off;
        }

        location /api/ocr/ {
            proxy_pass http://leaf_ocr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20M;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://leaf_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location /graphql {
            proxy_pass http://leaf_backend/graphql;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /socket.io/ {
            proxy_pass http://leaf_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 15;
            proxy_buffering off;
            proxy_socket_keepalive on;
            access_log off;
        }

        location / {
            proxy_pass http://leaf_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
            proxy_buffering off;
        }

        location /api/woovi/webhook {
            proxy_pass http://leaf_backend/api/woovi/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $leaf_client_addr;
            proxy_set_header X-Forwarded-For $leaf_client_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

}
