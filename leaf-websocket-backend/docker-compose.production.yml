      - KYC_TRUST_RANDOM_AUDIT_DECISION_TTL_SECONDS=${KYC_TRUST_RANDOM_AUDIT_DECISION_TTL_SECONDS:-172800}
      - KYC_TRUST_STATE_CACHE_TTL_SECONDS=${KYC_TRUST_STATE_CACHE_TTL_SECONDS:-300}
      - KYC_CANONICAL_SESSION_CLAIM_TTL_SECONDS=${KYC_CANONICAL_SESSION_CLAIM_TTL_SECONDS:-120}
      - KYC_IDENTITY_VERIFICATION_WINDOW_TTL_SECONDS=${KYC_IDENTITY_VERIFICATION_WINDOW_TTL_SECONDS:-1500}

      # Biometria facial InsightFace/FastAPI
      # Shared VPS: http://leaf-face-compare-service:8008
      # Dedicated VPS: https://biometric.leaf.example
      - KYC_VPS_PROVIDER=${KYC_VPS_PROVIDER:-auto}
      - BIOMETRIC_FACE_SERVICE_URL=${BIOMETRIC_FACE_SERVICE_URL:-}
      - BIOMETRIC_FACE_SERVICE_API_KEY=${BIOMETRIC_FACE_SERVICE_API_KEY:-}
      - BIOMETRIC_FACE_SERVICE_API_KEY_HEADER=${BIOMETRIC_FACE_SERVICE_API_KEY_HEADER:-X-Leaf-Biometric-Key}
      - BIOMETRIC_FACE_SERVICE_TIMEOUT_MS=${BIOMETRIC_FACE_SERVICE_TIMEOUT_MS:-90000}
      - BIOMETRIC_FACE_APPROVE_THRESHOLD=${BIOMETRIC_FACE_APPROVE_THRESHOLD:-0.61}
      - BIOMETRIC_FACE_REVIEW_THRESHOLD=${BIOMETRIC_FACE_REVIEW_THRESHOLD:-0.40}
      - BIOMETRIC_SERVER_SIDE_MAX_CONCURRENCY=${BIOMETRIC_SERVER_SIDE_MAX_CONCURRENCY:-4}
      - BIOMETRIC_SERVER_SIDE_MAX_QUEUE=${BIOMETRIC_SERVER_SIDE_MAX_QUEUE:-250}
      - MOBILE_FACE_EMBEDDING_ENABLED=${MOBILE_FACE_EMBEDDING_ENABLED:-true}
      - MOBILE_FACE_EMBEDDING_ALLOWED_MODES=${MOBILE_FACE_EMBEDDING_ALLOWED_MODES:-mobile_arcface_w600k_r50_v1,device_embedding_v1}
      - MOBILE_FACE_EMBEDDING_FORMAT=${MOBILE_FACE_EMBEDDING_FORMAT:-float32-l2-normalized-512}
      - MOBILE_FACE_EMBEDDING_DIMENSION=${MOBILE_FACE_EMBEDDING_DIMENSION:-512}
      - MOBILE_FACE_EMBEDDING_NORM_MIN=${MOBILE_FACE_EMBEDDING_NORM_MIN:-0.95}
      - MOBILE_FACE_EMBEDDING_NORM_MAX=${MOBILE_FACE_EMBEDDING_NORM_MAX:-1.05}
      - MOBILE_FACE_EMBEDDING_LOCAL_COMPARE_FALLBACK=${MOBILE_FACE_EMBEDDING_LOCAL_COMPARE_FALLBACK:-true}
      - KYC_PRODUCTION_BIOMETRICS_ENABLED=${KYC_PRODUCTION_BIOMETRICS_ENABLED:-false}
      - KYC_STRICT_PRODUCTION_MODE=${KYC_STRICT_PRODUCTION_MODE:-false}
      - KYC_REQUIRE_TRUSTED_BIOMETRIC_MATCH=${KYC_REQUIRE_TRUSTED_BIOMETRIC_MATCH:-false}
      - KYC_ALLOW_LEGACY_DEVICE_SIGNATURE=${KYC_ALLOW_LEGACY_DEVICE_SIGNATURE:-true}
      - KYC_ALLOW_AWS_LIVENESS_ONLY_MATCH=${KYC_ALLOW_AWS_LIVENESS_ONLY_MATCH:-true}
      - KYC_TRUSTED_BIOMETRIC_MATCH_PROVIDERS=${KYC_TRUSTED_BIOMETRIC_MATCH_PROVIDERS:-mobile_face_embedding,biometric-face-service,leaf_face_compare_service}
      - ENABLE_CNH_FACE_BIOMETRICS=${ENABLE_CNH_FACE_BIOMETRICS:-false}
      - CNH_FACE_BIOMETRICS_BLOCKING=${CNH_FACE_BIOMETRICS_BLOCKING:-false}
      - CNH_DIGITAL_PHOTO_CROP_LEFT=${CNH_DIGITAL_PHOTO_CROP_LEFT:-0.200044}
      - CNH_DIGITAL_PHOTO_CROP_TOP=${CNH_DIGITAL_PHOTO_CROP_TOP:-0.404421}
      - CNH_DIGITAL_PHOTO_CROP_WIDTH=${CNH_DIGITAL_PHOTO_CROP_WIDTH:-0.219841}
      - CNH_DIGITAL_PHOTO_CROP_HEIGHT=${CNH_DIGITAL_PHOTO_CROP_HEIGHT:-0.396786}

    volumes:
      # Firebase credentials (montar arquivo JSON)
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      # Logs
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 6g
    cpus: "5.50"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - leaf-network


  # ===== SIDE EFFECTS WORKER =====
  sideeffects-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: leaf-sideeffects-worker
    command: ["bash", "scripts/runtime/start-sideeffects-worker.sh"]
    environment:
      # Ambiente
      - NODE_ENV=production
      - RUNTIME_ROLE=sideeffects
      - ENABLE_EMBEDDED_LISTENER_WORKERS=false

      # Launch control (must match the gateways so the worker preflight cannot
      # start under a broader policy than the active runtime).
      - LEAF_LAUNCH_PROFILE=${LEAF_LAUNCH_PROFILE:-full}
      - LEAF_RIDE_FLOW_VALIDATION_ACK=${LEAF_RIDE_FLOW_VALIDATION_ACK:-false}
      - LEAF_PILOT_CONTROLLED=${LEAF_PILOT_CONTROLLED:-false}
      - PILOT_ALLOWED_PASSENGER_IDS=${PILOT_ALLOWED_PASSENGER_IDS:-}
      - PILOT_ALLOWED_DRIVER_IDS=${PILOT_ALLOWED_DRIVER_IDS:-}
      - PILOT_REGION_IDS=${PILOT_REGION_IDS:-}
      - LEAF_ACCEPT_NEW_PIX=${LEAF_ACCEPT_NEW_PIX:-true}
      - LEAF_ACCEPT_NEW_BOOKINGS=${LEAF_ACCEPT_NEW_BOOKINGS:-true}
      - LEAF_RUNTIME_POLICY_VERSION=${LEAF_RUNTIME_POLICY_VERSION:-}
      - GEOFENCE_FAIL_CLOSED=${GEOFENCE_FAIL_CLOSED:-true}
      - GEOFENCE_REQUIRE_DESTINATION_INSIDE_REGION=${GEOFENCE_REQUIRE_DESTINATION_INSIDE_REGION:-true}
      - GEOFENCE_REGION_FILE=${GEOFENCE_REGION_FILE:-config/geofence.json}
      - GEOFENCE_REGION_VERSION=${GEOFENCE_REGION_VERSION:-}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0

      # Firebase (push notifications)
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-leaf-app-91dfdce0}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://leaf-reactnative-default-rtdb.firebaseio.com}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json

      # Monitoramento
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - WORKER_STREAM_NAME=ride_events
      - WORKER_GROUP_NAME=listener-workers
      - WORKER_BATCH_SIZE=16
      - WORKER_BLOCK_TIME=150
      - WORKER_UNHANDLED_QUIET_EVENTS=ride.requested,ride.queued,state.changed,driver.notified,driver.search.started,ride.completed,ride.dequeued,queue.processed
      - WORKER_MAX_RETRIES=3
      - WORKER_STREAM_SAFE_TRIM_THRESHOLD=${WORKER_STREAM_SAFE_TRIM_THRESHOLD:-500000}
      - WORKER_STREAM_TRIM_CHECK_EVERY_ACKS=${WORKER_STREAM_TRIM_CHECK_EVERY_ACKS:-5000}
      - WORKER_DLQ_MAXLEN=${WORKER_DLQ_MAXLEN:-10000}
      - SUBSCRIPTION_DAILY_BILLING_ENABLED=${SUBSCRIPTION_DAILY_BILLING_ENABLED:-false}
      - SUBSCRIPTION_DAILY_FEE_NOMINAL_CENTS=${SUBSCRIPTION_DAILY_FEE_NOMINAL_CENTS:-1490}
      - SUBSCRIPTION_DAILY_MIN_ACCOUNT_AGE_DAYS=${SUBSCRIPTION_DAILY_MIN_ACCOUNT_AGE_DAYS:-60}
      - SUBSCRIPTION_DAILY_NOTICE_DAYS=${SUBSCRIPTION_DAILY_NOTICE_DAYS:-60}
      - SUBSCRIPTION_DAILY_REQUIRE_CITY_ACTIVATION=${SUBSCRIPTION_DAILY_REQUIRE_CITY_ACTIVATION:-true}
      - SUBSCRIPTION_DAILY_ELIGIBLE_CITIES=${SUBSCRIPTION_DAILY_ELIGIBLE_CITIES:-}
      - SUBSCRIPTION_DAILY_FEE_CENTS=${SUBSCRIPTION_DAILY_FEE_CENTS:-1490}
      - SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS:-490}
      - SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS:-790}
      - SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS:-1490}
      - SUBSCRIPTION_PLUS_DAILY_CENTS=${SUBSCRIPTION_PLUS_DAILY_CENTS:-1490}
      - ENABLE_RIDE_EXTENSION_FLOW=${ENABLE_RIDE_EXTENSION_FLOW:-true}
      - ENABLE_RIDER_EARLY_END=${ENABLE_RIDER_EARLY_END:-true}
      - ENABLE_OPERATIONAL_REASSIGNMENT=${ENABLE_OPERATIONAL_REASSIGNMENT:-false}
      - ENABLE_MULTI_LEG_BILLING=${ENABLE_MULTI_LEG_BILLING:-false}
      - RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC=${RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC:-300}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      websocket:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2048m
    cpus: "1.25"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "node", "-e", "const redis=require('./utils/redis-pool'); redis.ensureConnection().then(()=>process.exit(0)).catch(()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - leaf-network

  # ===== BILLING WORKER =====
  billing-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: leaf-billing-worker
    command: ["node", "workers/worker-billing.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RUNTIME_ROLE=billing
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-leaf-app-91dfdce0}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://leaf-reactnative-default-rtdb.firebaseio.com}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - WORKER_STREAM_SAFE_TRIM_THRESHOLD=${WORKER_STREAM_SAFE_TRIM_THRESHOLD:-500000}
      - WORKER_STREAM_TRIM_CHECK_EVERY_ACKS=${WORKER_STREAM_TRIM_CHECK_EVERY_ACKS:-5000}
      - WORKER_DLQ_MAXLEN=${WORKER_DLQ_MAXLEN:-10000}
      - SUBSCRIPTION_DAILY_BILLING_ENABLED=${SUBSCRIPTION_DAILY_BILLING_ENABLED:-false}
      - SUBSCRIPTION_DAILY_FEE_NOMINAL_CENTS=${SUBSCRIPTION_DAILY_FEE_NOMINAL_CENTS:-1490}
      - SUBSCRIPTION_DAILY_MIN_ACCOUNT_AGE_DAYS=${SUBSCRIPTION_DAILY_MIN_ACCOUNT_AGE_DAYS:-60}
      - SUBSCRIPTION_DAILY_NOTICE_DAYS=${SUBSCRIPTION_DAILY_NOTICE_DAYS:-60}
      - SUBSCRIPTION_DAILY_REQUIRE_CITY_ACTIVATION=${SUBSCRIPTION_DAILY_REQUIRE_CITY_ACTIVATION:-true}
      - SUBSCRIPTION_DAILY_ELIGIBLE_CITIES=${SUBSCRIPTION_DAILY_ELIGIBLE_CITIES:-}
      - SUBSCRIPTION_DAILY_FEE_CENTS=${SUBSCRIPTION_DAILY_FEE_CENTS:-1490}
      - SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS:-490}
      - SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS:-790}
      - SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS:-1490}
      - SUBSCRIPTION_PLUS_DAILY_CENTS=${SUBSCRIPTION_PLUS_DAILY_CENTS:-1490}
      - ENABLE_RIDE_EXTENSION_FLOW=${ENABLE_RIDE_EXTENSION_FLOW:-true}
      - ENABLE_RIDER_EARLY_END=${ENABLE_RIDER_EARLY_END:-true}
      - ENABLE_OPERATIONAL_REASSIGNMENT=${ENABLE_OPERATIONAL_REASSIGNMENT:-false}
      - ENABLE_MULTI_LEG_BILLING=${ENABLE_MULTI_LEG_BILLING:-false}
      - RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC=${RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC:-300}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      websocket:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1280m
    cpus: "1.00"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "node", "-e", "const redis=require('./utils/redis-pool'); redis.ensureConnection().then(()=>process.exit(0)).catch(()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - leaf-network

  # ===== NGINX (Reverse Proxy) =====
  nginx:
    image: nginx:alpine
    container_name: leaf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      websocket:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - leaf-network

volumes:
  redis_data:

    driver: local

networks:
  leaf-network:
    driver: bridge
