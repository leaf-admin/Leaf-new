services:
  # ===== REDIS =====
  redis:
    image: redis:7.4.9-alpine3.21@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: leaf-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 2304mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    # Expõe Redis apenas no loopback do host principal para permitir túnel SSH
    # a partir de um segundo host realtime sem abrir a porta publicamente.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    mem_limit: 3072m
    cpus: "2.00"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    # Host prerequisite validated by the deployment runbook: vm.overcommit_memory=1.
    # Compose must not mutate the host kernel automatically.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --no-auth-warning --raw ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - leaf-network

