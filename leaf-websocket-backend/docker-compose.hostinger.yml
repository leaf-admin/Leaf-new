services:
  # ===== REDIS =====
  redis:
    image: redis:7-alpine
    container_name: leaf-redis
    command: redis-server --appendonly yes --maxmemory 2304mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    # Expõe Redis apenas no loopback do host principal para permitir túnel SSH
    # a partir de um segundo host realtime sem abrir a porta publicamente.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    mem_limit: 3072m
    cpus: "2.00"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - leaf-network

  # ===== WEBSOCKET SERVER =====
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaf-websocket
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # Ambiente
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - RUNTIME_ROLE=gateway
      - ENABLE_EMBEDDED_LISTENER_WORKERS=false
      - ENABLE_DIRECT_RIDE_REQUESTED_DISPATCH=true
      - LEAF_SERVER_RUNTIME=modular
      - AUTO_TEST_MODE=${AUTO_TEST_MODE:-false}
      - QA_SOCKET_BYPASS_UIDS=${QA_SOCKET_BYPASS_UIDS:-}
      - LEAF_CLUSTER_ENABLED=${LEAF_CLUSTER_ENABLED:-true}
      - ENABLE_SOCKETIO_REDIS_ADAPTER=${ENABLE_SOCKETIO_REDIS_ADAPTER:-true}
      - REQUIRE_SOCKETIO_REDIS_ADAPTER=${REQUIRE_SOCKETIO_REDIS_ADAPTER:-true}
      - LEAF_CLUSTER_WORKERS=${LEAF_CLUSTER_WORKERS:-6}
      - LEAF_CLUSTER_SCHEDULER_LEADER_ID=${LEAF_CLUSTER_SCHEDULER_LEADER_ID:-1}
      - SOCKET_ALLOW_POLLING=${SOCKET_ALLOW_POLLING:-false}
      - SOCKET_ADMISSION_ENABLED=${SOCKET_ADMISSION_ENABLED:-true}
      - SOCKET_ADMISSION_MAX_INFLIGHT=${SOCKET_ADMISSION_MAX_INFLIGHT:-1200}
      - SOCKET_ADMISSION_MAX_QUEUE=${SOCKET_ADMISSION_MAX_QUEUE:-16000}
      - SOCKET_ADMISSION_MAX_WAIT_MS=${SOCKET_ADMISSION_MAX_WAIT_MS:-25000}
      - SOCKET_ADMISSION_HOLD_MS=${SOCKET_ADMISSION_HOLD_MS:-4000}
      - AUTH_VERIFY_ADMISSION_ENABLED=${AUTH_VERIFY_ADMISSION_ENABLED:-true}
      - AUTH_VERIFY_MAX_INFLIGHT=${AUTH_VERIFY_MAX_INFLIGHT:-720}
      - AUTH_VERIFY_MAX_QUEUE=${AUTH_VERIFY_MAX_QUEUE:-16000}
      - AUTH_VERIFY_MAX_WAIT_MS=${AUTH_VERIFY_MAX_WAIT_MS:-25000}
      - AUTH_VERIFY_BUSY_RETRY_ATTEMPTS=${AUTH_VERIFY_BUSY_RETRY_ATTEMPTS:-2}
      - AUTH_VERIFY_BUSY_RETRY_DELAY_MS=${AUTH_VERIFY_BUSY_RETRY_DELAY_MS:-200}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - DISPATCH_NOTIFY_CONCURRENCY=${DISPATCH_NOTIFY_CONCURRENCY:-36}
      - DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS=${DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS:-20}
      - DISPATCH_VERIFY_SOCKET_ROOM=${DISPATCH_VERIFY_SOCKET_ROOM:-false}
      - MATCH_DRIVERS_PER_WAVE=${MATCH_DRIVERS_PER_WAVE:-48}
      - MATCH_EXPANSION_INTERVAL_MS=${MATCH_EXPANSION_INTERVAL_MS:-250}
      - MATCH_EMPTY_WAVE_INTERVAL_MS=${MATCH_EMPTY_WAVE_INTERVAL_MS:-100}
      - MATCH_INITIAL_RADIUS_KM=${MATCH_INITIAL_RADIUS_KM:-2.0}
      - MATCH_EXPANSION_STEP_KM=${MATCH_EXPANSION_STEP_KM:-1.5}
      - DISPATCH_GEO_CANDIDATE_MIN=${DISPATCH_GEO_CANDIDATE_MIN:-384}
      - DISPATCH_GEO_CANDIDATE_MAX=${DISPATCH_GEO_CANDIDATE_MAX:-1200}
      - DISPATCH_SCORE_POOL_MIN=${DISPATCH_SCORE_POOL_MIN:-96}
      - DISPATCH_SCORE_POOL_MAX=${DISPATCH_SCORE_POOL_MAX:-320}
      - ENABLE_LEGACY_RUNTIME_ENDPOINTS=${ENABLE_LEGACY_RUNTIME_ENDPOINTS:-false}
      - ENABLE_LEGACY_UPDATE_DRIVER_LOCATION_EVENT=${ENABLE_LEGACY_UPDATE_DRIVER_LOCATION_EVENT:-false}
      - ENABLE_LEGACY_NO_DRIVERS_FOUND_EVENT=${ENABLE_LEGACY_NO_DRIVERS_FOUND_EVENT:-false}
      - ENABLE_LEGACY_AUTH_VERIFY_ROUTE=${ENABLE_LEGACY_AUTH_VERIFY_ROUTE:-false}
      - ENABLE_LEGACY_WOOVI_ALIAS_ROUTE=${ENABLE_LEGACY_WOOVI_ALIAS_ROUTE:-false}
      - ENABLE_LEGACY_SOCKET_BRIDGE=${ENABLE_LEGACY_SOCKET_BRIDGE:-false}
      - ENABLE_LEGACY_SOCKET_NOTIFICATIONS=${ENABLE_LEGACY_SOCKET_NOTIFICATIONS:-false}
      - ENABLE_LEGACY_PROMOTIONS_ROUTES=${ENABLE_LEGACY_PROMOTIONS_ROUTES:-false}
      - ENABLE_RIDE_EXTENSION_FLOW=${ENABLE_RIDE_EXTENSION_FLOW:-true}
      - ENABLE_RIDER_EARLY_END=${ENABLE_RIDER_EARLY_END:-true}
      - ENABLE_OPERATIONAL_REASSIGNMENT=${ENABLE_OPERATIONAL_REASSIGNMENT:-false}
      - ENABLE_MULTI_LEG_BILLING=${ENABLE_MULTI_LEG_BILLING:-false}
      - RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC=${RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC:-300}
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      
      # Firebase (configurar via .env ou variáveis)
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-leaf-app-91dfdce0}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://leaf-reactnative-default-rtdb.firebaseio.com}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      
      # Woovi
      - WOOVI_WEBHOOK_URL=${WOOVI_WEBHOOK_URL:-https://api.leaf.app.br/api/woovi/webhook}
      - SERVER_URL=${SERVER_URL:-https://api.leaf.app.br}
      - WOOVI_ENVIRONMENT=${WOOVI_ENVIRONMENT:-production}
      - WOOVI_API_TOKEN=${WOOVI_API_TOKEN}
      - WOOVI_APP_ID=${WOOVI_APP_ID}
      - WOOVI_CLIENT_ID=${WOOVI_CLIENT_ID:-}
      - WOOVI_CLIENT_SECRET=${WOOVI_CLIENT_SECRET:-}
      - WOOVI_BASE_URL=${WOOVI_BASE_URL:-https://api.woovi.com/api/v1}
      - WOOVI_MASTER_API_TOKEN=${WOOVI_MASTER_API_TOKEN}
      - WOOVI_MASTER_APP_ID=${WOOVI_MASTER_APP_ID}
      - WOOVI_WEBHOOK_REQUIRE_SIGNATURE=${WOOVI_WEBHOOK_REQUIRE_SIGNATURE:-true}
      - WOOVI_WEBHOOK_ALLOW_UNSIGNED=${WOOVI_WEBHOOK_ALLOW_UNSIGNED:-false}
      - WOOVI_WEBHOOK_PROVIDER_VERIFICATION_REQUIRED=${WOOVI_WEBHOOK_PROVIDER_VERIFICATION_REQUIRED:-true}
      - WOOVI_WEBHOOK_PUBLIC_KEY=${WOOVI_WEBHOOK_PUBLIC_KEY:-}
      - OPENPIX_WEBHOOK_PUBLIC_KEY=${OPENPIX_WEBHOOK_PUBLIC_KEY:-}
      - WOOVI_WEBHOOK_SIGNATURE_SECRET=${WOOVI_WEBHOOK_SIGNATURE_SECRET:-}
      - OPENPIX_WEBHOOK_SIGNATURE_SECRET=${OPENPIX_WEBHOOK_SIGNATURE_SECRET:-}
      - WOOVI_WEBHOOK_HMAC_SECRET=${WOOVI_WEBHOOK_HMAC_SECRET:-}
      - OPENPIX_WEBHOOK_HMAC_SECRET=${OPENPIX_WEBHOOK_HMAC_SECRET:-}
      
      # API Keys
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - MAPBOX_API_KEY=${MAPBOX_API_KEY:-}
      - LOCATIONIQ_API_KEY=${LOCATIONIQ_API_KEY:-}
      
      # Segurança
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ADMIN_JWT_REFRESH_SECRET=${ADMIN_JWT_REFRESH_SECRET}
      - RUNTIME_ADMIN_TOKEN=${RUNTIME_ADMIN_TOKEN}
      - RESTART_TOKEN=${RESTART_TOKEN}
      - RATE_LIMIT_HTTP_DRIVER_STATUS_DEBUG=${RATE_LIMIT_HTTP_DRIVER_STATUS_DEBUG:-25000}
      - RATE_LIMIT_HTTP_DRIVER_STATUS_DEBUG_WINDOW_SECONDS=${RATE_LIMIT_HTTP_DRIVER_STATUS_DEBUG_WINDOW_SECONDS:-60}
      - DRIVER_STATUS_REQUIRE_LOCAL_SOCKET=${DRIVER_STATUS_REQUIRE_LOCAL_SOCKET:-false}
      
      # Monitoramento
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - DISCORD_ALERT_WEBHOOK_URL=${DISCORD_ALERT_WEBHOOK_URL:-}
      - DISCORD_CRITICAL_ALERT_WEBHOOK_URL=${DISCORD_CRITICAL_ALERT_WEBHOOK_URL:-}
      - DISCORD_ALERT_MENTION=${DISCORD_ALERT_MENTION:-}
      - DISCORD_ALERT_USERNAME=${DISCORD_ALERT_USERNAME:-Leaf Observability}
      - DISCORD_EARNINGS_WEBHOOK_URL=${DISCORD_EARNINGS_WEBHOOK_URL:-}
      - DISCORD_EARNINGS_USERNAME=${DISCORD_EARNINGS_USERNAME:-Leaf Earnings}
      - DAILY_EARNINGS_REPORT_ENABLED=${DAILY_EARNINGS_REPORT_ENABLED:-true}
      - DAILY_EARNINGS_REPORT_CRON=${DAILY_EARNINGS_REPORT_CRON:-5 6 * * *}
      - DAILY_EARNINGS_REPORT_SEND_EMPTY=${DAILY_EARNINGS_REPORT_SEND_EMPTY:-true}
      - LEAF_REPORT_TIME_ZONE=${LEAF_REPORT_TIME_ZONE:-America/Sao_Paulo}
      - RIDE_COST_ALERTS_ENABLED=${RIDE_COST_ALERTS_ENABLED:-true}
      - RIDE_COST_WARNING_BRL=${RIDE_COST_WARNING_BRL:-0.20}
      - RIDE_COST_CRITICAL_BRL=${RIDE_COST_CRITICAL_BRL:-0.30}
      - RIDE_COST_TELEMETRY_USD_BRL_RATE=${RIDE_COST_TELEMETRY_USD_BRL_RATE:-5.20}
      
      # Leaf específico
      - LEAF_WOOVI_ACCOUNT_ID=${LEAF_WOOVI_ACCOUNT_ID}
      - LEAF_PIX_KEY=${LEAF_PIX_KEY}
      - SUBSCRIPTION_DAILY_BILLING_ENABLED=${SUBSCRIPTION_DAILY_BILLING_ENABLED:-false}
      - SUBSCRIPTION_DAILY_FEE_CENTS=${SUBSCRIPTION_DAILY_FEE_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_DAILY_CENTS=${SUBSCRIPTION_PLUS_DAILY_CENTS:-990}
      - PAYMENT_BYPASS_ON_WOOVI_FAILURE=${PAYMENT_BYPASS_ON_WOOVI_FAILURE:-false}
      - PAYMENT_FORCE_BYPASS=${PAYMENT_FORCE_BYPASS:-false}
      - PAYMENT_FORCE_BYPASS_PASSENGERS=${PAYMENT_FORCE_BYPASS_PASSENGERS:-}
      - PAYMENT_FORCE_BYPASS_USER_IDS=${PAYMENT_FORCE_BYPASS_USER_IDS:-}

      # AWS Rekognition Face Liveness (KYC)
      - KYC_AWS_LIVENESS_ENABLED=${KYC_AWS_LIVENESS_ENABLED:-false}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - KYC_AWS_LIVENESS_CONFIDENCE_THRESHOLD=${KYC_AWS_LIVENESS_CONFIDENCE_THRESHOLD:-80}
      - KYC_AWS_LIVENESS_SESSION_TTL_SECONDS=${KYC_AWS_LIVENESS_SESSION_TTL_SECONDS:-1200}
      - KYC_AWS_LIVENESS_AUDIT_IMAGES_LIMIT=${KYC_AWS_LIVENESS_AUDIT_IMAGES_LIMIT:-0}
      - KYC_AWS_LIVENESS_ESTIMATED_UNIT_COST_USD=${KYC_AWS_LIVENESS_ESTIMATED_UNIT_COST_USD:-0.015}
      - KYC_AWS_LIVENESS_MAX_ATTEMPTS_PER_WINDOW=${KYC_AWS_LIVENESS_MAX_ATTEMPTS_PER_WINDOW:-2}
      - KYC_AWS_LIVENESS_WITHDRAWAL_MAX_ATTEMPTS_PER_WINDOW=${KYC_AWS_LIVENESS_WITHDRAWAL_MAX_ATTEMPTS_PER_WINDOW:-2}
      - KYC_AWS_LIVENESS_ATTEMPT_WINDOW_SECONDS=${KYC_AWS_LIVENESS_ATTEMPT_WINDOW_SECONDS:-86400}
      - KYC_AWS_LIVENESS_SOFT_BLOCK_ON_EXHAUSTED=${KYC_AWS_LIVENESS_SOFT_BLOCK_ON_EXHAUSTED:-true}
      - KYC_AWS_LIVENESS_SDK_MAX_ATTEMPTS=${KYC_AWS_LIVENESS_SDK_MAX_ATTEMPTS:-2}
      - KYC_AWS_LIVENESS_CREDENTIALS_ENABLED=${KYC_AWS_LIVENESS_CREDENTIALS_ENABLED:-true}
      - KYC_AWS_LIVENESS_STS_DURATION_SECONDS=${KYC_AWS_LIVENESS_STS_DURATION_SECONDS:-900}
      - KYC_AWS_LIVENESS_ASSUME_ROLE_ARN=${KYC_AWS_LIVENESS_ASSUME_ROLE_ARN:-}
      - KYC_AWS_LIVENESS_ASSUME_ROLE_EXTERNAL_ID=${KYC_AWS_LIVENESS_ASSUME_ROLE_EXTERNAL_ID:-}
      - KYC_AWS_LIVENESS_STS_SESSION_NAME_PREFIX=${KYC_AWS_LIVENESS_STS_SESSION_NAME_PREFIX:-leaf-liveness}
      - KYC_AWS_LIVENESS_S3_BUCKET=${KYC_AWS_LIVENESS_S3_BUCKET:-}
      - KYC_AWS_LIVENESS_S3_PREFIX=${KYC_AWS_LIVENESS_S3_PREFIX:-kyc/liveness}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}

      # Biometria facial InsightFace/FastAPI
      # Shared VPS: http://leaf-face-compare-service:8008
      # Dedicated VPS: https://biometric.leaf.example
      - KYC_VPS_PROVIDER=${KYC_VPS_PROVIDER:-auto}
      - BIOMETRIC_FACE_SERVICE_URL=${BIOMETRIC_FACE_SERVICE_URL:-}
      - BIOMETRIC_FACE_SERVICE_API_KEY=${BIOMETRIC_FACE_SERVICE_API_KEY:-}
      - BIOMETRIC_FACE_SERVICE_API_KEY_HEADER=${BIOMETRIC_FACE_SERVICE_API_KEY_HEADER:-X-Leaf-Biometric-Key}
      - BIOMETRIC_FACE_SERVICE_TIMEOUT_MS=${BIOMETRIC_FACE_SERVICE_TIMEOUT_MS:-90000}
      - BIOMETRIC_FACE_APPROVE_THRESHOLD=${BIOMETRIC_FACE_APPROVE_THRESHOLD:-0.61}
      - BIOMETRIC_FACE_REVIEW_THRESHOLD=${BIOMETRIC_FACE_REVIEW_THRESHOLD:-0.40}
      - BIOMETRIC_SERVER_SIDE_MAX_CONCURRENCY=${BIOMETRIC_SERVER_SIDE_MAX_CONCURRENCY:-4}
      - BIOMETRIC_SERVER_SIDE_MAX_QUEUE=${BIOMETRIC_SERVER_SIDE_MAX_QUEUE:-250}
      - MOBILE_FACE_EMBEDDING_ENABLED=${MOBILE_FACE_EMBEDDING_ENABLED:-true}
      - MOBILE_FACE_EMBEDDING_ALLOWED_MODES=${MOBILE_FACE_EMBEDDING_ALLOWED_MODES:-mobile_arcface_w600k_r50_v1,device_embedding_v1}
      - MOBILE_FACE_EMBEDDING_FORMAT=${MOBILE_FACE_EMBEDDING_FORMAT:-float32-l2-normalized-512}
      - MOBILE_FACE_EMBEDDING_DIMENSION=${MOBILE_FACE_EMBEDDING_DIMENSION:-512}
      - MOBILE_FACE_EMBEDDING_NORM_MIN=${MOBILE_FACE_EMBEDDING_NORM_MIN:-0.95}
      - MOBILE_FACE_EMBEDDING_NORM_MAX=${MOBILE_FACE_EMBEDDING_NORM_MAX:-1.05}
      - MOBILE_FACE_EMBEDDING_LOCAL_COMPARE_FALLBACK=${MOBILE_FACE_EMBEDDING_LOCAL_COMPARE_FALLBACK:-true}
      - KYC_PRODUCTION_BIOMETRICS_ENABLED=${KYC_PRODUCTION_BIOMETRICS_ENABLED:-false}
      - ENABLE_STRICT_BIOMETRIC_KYC=${ENABLE_STRICT_BIOMETRIC_KYC:-false}
      - KYC_PRODUCTION_BIOMETRICS_DISABLED_INTENTIONALLY=${KYC_PRODUCTION_BIOMETRICS_DISABLED_INTENTIONALLY:-true}
      - KYC_PRODUCTION_BIOMETRICS_DISABLED_REASON=${KYC_PRODUCTION_BIOMETRICS_DISABLED_REASON:-pilot runtime uses local face embedding + support escalation until AWS liveness credentials are provisioned}
      - KYC_REQUIRE_TRUSTED_BIOMETRIC_MATCH=${KYC_REQUIRE_TRUSTED_BIOMETRIC_MATCH:-false}
      - KYC_ALLOW_LEGACY_DEVICE_SIGNATURE=${KYC_ALLOW_LEGACY_DEVICE_SIGNATURE:-true}
      - KYC_ALLOW_AWS_LIVENESS_ONLY_MATCH=${KYC_ALLOW_AWS_LIVENESS_ONLY_MATCH:-true}
      - KYC_TRUSTED_BIOMETRIC_MATCH_PROVIDERS=${KYC_TRUSTED_BIOMETRIC_MATCH_PROVIDERS:-mobile_face_embedding,biometric-face-service,leaf_face_compare_service}
      - ENABLE_CNH_FACE_BIOMETRICS=${ENABLE_CNH_FACE_BIOMETRICS:-false}
      - CNH_FACE_BIOMETRICS_BLOCKING=${CNH_FACE_BIOMETRICS_BLOCKING:-false}
      - CNH_DIGITAL_PHOTO_CROP_LEFT=${CNH_DIGITAL_PHOTO_CROP_LEFT:-0.200044}
      - CNH_DIGITAL_PHOTO_CROP_TOP=${CNH_DIGITAL_PHOTO_CROP_TOP:-0.404421}
      - CNH_DIGITAL_PHOTO_CROP_WIDTH=${CNH_DIGITAL_PHOTO_CROP_WIDTH:-0.219841}
      - CNH_DIGITAL_PHOTO_CROP_HEIGHT=${CNH_DIGITAL_PHOTO_CROP_HEIGHT:-0.396786}
      
    volumes:
      # Firebase credentials (montar arquivo JSON)
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      # Logs
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 6g
    cpus: "5.50"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - leaf-network


  # ===== SIDE EFFECTS WORKER =====
  sideeffects-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaf-sideeffects-worker
    command: ["bash", "scripts/runtime/start-sideeffects-worker.sh"]
    environment:
      # Ambiente
      - NODE_ENV=production
      - RUNTIME_ROLE=sideeffects
      - ENABLE_EMBEDDED_LISTENER_WORKERS=false
      - LEAF_SERVER_RUNTIME=modular

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0

      # Firebase (push notifications)
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-leaf-app-91dfdce0}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://leaf-reactnative-default-rtdb.firebaseio.com}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json

      # Monitoramento
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - WORKER_STREAM_NAME=ride_events
      - WORKER_GROUP_NAME=listener-workers
      - WORKER_BATCH_SIZE=16
      - WORKER_BLOCK_TIME=150
      - WORKER_UNHANDLED_QUIET_EVENTS=ride.requested,ride.queued,state.changed,driver.notified,driver.search.started,ride.completed,ride.dequeued,queue.processed
      - WORKER_MAX_RETRIES=3
      - SUBSCRIPTION_DAILY_BILLING_ENABLED=${SUBSCRIPTION_DAILY_BILLING_ENABLED:-false}
      - SUBSCRIPTION_DAILY_FEE_CENTS=${SUBSCRIPTION_DAILY_FEE_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_DAILY_CENTS=${SUBSCRIPTION_PLUS_DAILY_CENTS:-990}
      - ENABLE_RIDE_EXTENSION_FLOW=${ENABLE_RIDE_EXTENSION_FLOW:-true}
      - ENABLE_RIDER_EARLY_END=${ENABLE_RIDER_EARLY_END:-true}
      - ENABLE_OPERATIONAL_REASSIGNMENT=${ENABLE_OPERATIONAL_REASSIGNMENT:-false}
      - ENABLE_MULTI_LEG_BILLING=${ENABLE_MULTI_LEG_BILLING:-false}
      - RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC=${RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC:-300}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      websocket:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2048m
    cpus: "1.25"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "node", "-e", "const redis=require('./utils/redis-pool'); redis.ensureConnection().then(()=>process.exit(0)).catch(()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - leaf-network

  # ===== BILLING WORKER =====
  billing-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaf-billing-worker
    command: ["node", "workers/worker-billing.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RUNTIME_ROLE=billing
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-leaf-app-91dfdce0}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://leaf-reactnative-default-rtdb.firebaseio.com}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - SUBSCRIPTION_DAILY_BILLING_ENABLED=${SUBSCRIPTION_DAILY_BILLING_ENABLED:-false}
      - SUBSCRIPTION_DAILY_FEE_CENTS=${SUBSCRIPTION_DAILY_FEE_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_1_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_2_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS=${SUBSCRIPTION_PLUS_WAVE_3_DAILY_CENTS:-990}
      - SUBSCRIPTION_PLUS_DAILY_CENTS=${SUBSCRIPTION_PLUS_DAILY_CENTS:-990}
      - ENABLE_RIDE_EXTENSION_FLOW=${ENABLE_RIDE_EXTENSION_FLOW:-true}
      - ENABLE_RIDER_EARLY_END=${ENABLE_RIDER_EARLY_END:-true}
      - ENABLE_OPERATIONAL_REASSIGNMENT=${ENABLE_OPERATIONAL_REASSIGNMENT:-false}
      - ENABLE_MULTI_LEG_BILLING=${ENABLE_MULTI_LEG_BILLING:-false}
      - RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC=${RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC:-300}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      websocket:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1280m
    cpus: "1.00"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "node", "-e", "const redis=require('./utils/redis-pool'); redis.ensureConnection().then(()=>process.exit(0)).catch(()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - leaf-network

  # ===== NGINX (Reverse Proxy) =====
  nginx:
    image: nginx:alpine
    container_name: leaf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      websocket:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - leaf-network

volumes:
  redis_data:

    driver: local

networks:
  leaf-network:
    driver: bridge
