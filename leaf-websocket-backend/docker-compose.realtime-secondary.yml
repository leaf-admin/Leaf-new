services:
  websocket-secondary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaf-websocket-secondary
    env_file:
      - .env.realtime-secondary
    ports:
      - "${SECONDARY_PUBLIC_BIND_IP:-0.0.0.0}:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - RUNTIME_ROLE=gateway
      - SUBSCRIPTION_ONLINE_GATE_ENABLED=${SUBSCRIPTION_ONLINE_GATE_ENABLED:-true}
      - SUBSCRIPTION_GATE_CACHE_TTL_SECONDS=${SUBSCRIPTION_GATE_CACHE_TTL_SECONDS:-60}
      - ENABLE_EMBEDDED_LISTENER_WORKERS=false
      - RUNTIME_ENABLE_QUEUE_WORKER=false
      - ENABLE_DRIVER_POOL_MONITOR=false
      - ENABLE_RUNTIME_DEMAND_NOTIFICATION_SERVICE=false
      - ENABLE_RUNTIME_DASHBOARD_WEBSOCKET=false
      - ENABLE_DIRECT_RIDE_REQUESTED_DISPATCH=true
      - LEAF_CLUSTER_ENABLED=${LEAF_CLUSTER_ENABLED:-true}
      - ENABLE_SOCKETIO_REDIS_ADAPTER=${ENABLE_SOCKETIO_REDIS_ADAPTER:-true}
      - REQUIRE_SOCKETIO_REDIS_ADAPTER=${REQUIRE_SOCKETIO_REDIS_ADAPTER:-true}
      - LEAF_CLUSTER_WORKERS=${LEAF_CLUSTER_WORKERS:-4}
      - SOCKET_ALLOW_POLLING=${SOCKET_ALLOW_POLLING:-false}
      - SOCKET_ADMISSION_ENABLED=${SOCKET_ADMISSION_ENABLED:-true}
      - SOCKET_ADMISSION_MAX_INFLIGHT=${SOCKET_ADMISSION_MAX_INFLIGHT:-900}
      - SOCKET_ADMISSION_MAX_QUEUE=${SOCKET_ADMISSION_MAX_QUEUE:-12000}
      - SOCKET_ADMISSION_MAX_WAIT_MS=${SOCKET_ADMISSION_MAX_WAIT_MS:-25000}
      - SOCKET_ADMISSION_HOLD_MS=${SOCKET_ADMISSION_HOLD_MS:-4000}
      - AUTH_VERIFY_ADMISSION_ENABLED=${AUTH_VERIFY_ADMISSION_ENABLED:-true}
      - AUTH_VERIFY_MAX_INFLIGHT=${AUTH_VERIFY_MAX_INFLIGHT:-600}
      - AUTH_VERIFY_MAX_QUEUE=${AUTH_VERIFY_MAX_QUEUE:-12000}
      - AUTH_VERIFY_MAX_WAIT_MS=${AUTH_VERIFY_MAX_WAIT_MS:-25000}
      - AUTH_VERIFY_BUSY_RETRY_ATTEMPTS=${AUTH_VERIFY_BUSY_RETRY_ATTEMPTS:-2}
      - AUTH_VERIFY_BUSY_RETRY_DELAY_MS=${AUTH_VERIFY_BUSY_RETRY_DELAY_MS:-200}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - DISPATCH_NOTIFY_CONCURRENCY=${DISPATCH_NOTIFY_CONCURRENCY:-24}
      - DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS=${DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS:-20}
      - SMOKE_DRIVER_RESPONSE_TIMEOUT_SECONDS=${SMOKE_DRIVER_RESPONSE_TIMEOUT_SECONDS:-21600}
      - DISPATCH_VERIFY_SOCKET_ROOM=${DISPATCH_VERIFY_SOCKET_ROOM:-false}
      - MATCH_DRIVERS_PER_WAVE=${MATCH_DRIVERS_PER_WAVE:-40}
      - MATCH_EXPANSION_INTERVAL_MS=${MATCH_EXPANSION_INTERVAL_MS:-250}
      - MATCH_EMPTY_WAVE_INTERVAL_MS=${MATCH_EMPTY_WAVE_INTERVAL_MS:-100}
      - MATCH_INITIAL_RADIUS_KM=${MATCH_INITIAL_RADIUS_KM:-2.0}
      - MATCH_EXPANSION_STEP_KM=${MATCH_EXPANSION_STEP_KM:-1.5}
      - DISPATCH_GEO_CANDIDATE_MIN=${DISPATCH_GEO_CANDIDATE_MIN:-320}
      - DISPATCH_GEO_CANDIDATE_MAX=${DISPATCH_GEO_CANDIDATE_MAX:-1200}
      - DISPATCH_SCORE_POOL_MIN=${DISPATCH_SCORE_POOL_MIN:-80}
      - DISPATCH_SCORE_POOL_MAX=${DISPATCH_SCORE_POOL_MAX:-320}
      - REDIS_HOST=${PRIMARY_REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${PRIMARY_REDIS_PORT:-6381}
      - REDIS_PASSWORD=${PRIMARY_REDIS_PASSWORD:?set PRIMARY_REDIS_PASSWORD}
      - REDIS_DB=${PRIMARY_REDIS_DB:-0}
      - REDIS_URL=${PRIMARY_REDIS_URL:-redis://:${PRIMARY_REDIS_PASSWORD}@${PRIMARY_REDIS_HOST:-host.docker.internal}:${PRIMARY_REDIS_PORT:-6381}/${PRIMARY_REDIS_DB:-0}}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - REDIS_SENTINELS=${REDIS_SENTINELS:-}
      - REDIS_SENTINEL_MASTER_NAME=${REDIS_SENTINEL_MASTER_NAME:-leaf-master}
      - REDIS_SENTINEL_USERNAME=${REDIS_SENTINEL_USERNAME:-}
      - REDIS_SENTINEL_PASSWORD=${REDIS_SENTINEL_PASSWORD:-}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_USE_TLS=${REDIS_USE_TLS:-false}
      - REDIS_TLS_REJECT_UNAUTHORIZED=${REDIS_TLS_REJECT_UNAUTHORIZED:-true}
      - REDIS_SENTINEL_USE_TLS=${REDIS_SENTINEL_USE_TLS:-false}
      - REDIS_SENTINEL_TLS_REJECT_UNAUTHORIZED=${REDIS_SENTINEL_TLS_REJECT_UNAUTHORIZED:-true}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-leaf-app-91dfdce0}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://leaf-reactnative-default-rtdb.firebaseio.com}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - SERVER_URL=${SERVER_URL:-https://api.leaf.app.br}
      - WOOVI_WEBHOOK_URL=${WOOVI_WEBHOOK_URL:-https://api.leaf.app.br/api/woovi/webhook}
      - WOOVI_ENVIRONMENT=${WOOVI_ENVIRONMENT:-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    mem_limit: 4g
    cpus: "4.00"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
