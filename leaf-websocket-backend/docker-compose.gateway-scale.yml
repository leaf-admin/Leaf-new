  websocket-gateway-2:
    <<: *websocket_gateway_service
    container_name: leaf-websocket-gateway-2

  websocket-gateway-3:
    <<: *websocket_gateway_service
    container_name: leaf-websocket-gateway-3

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaf-queue-worker
    command: ["node", "workers/queue-worker-process.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RUNTIME_ROLE=queue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - ENABLE_SOCKETIO_REDIS_ADAPTER=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - QUEUE_WORKER_INTERVAL_MS=${QUEUE_WORKER_INTERVAL_MS:-1000}
      - QUEUE_WORKER_BATCH_SIZE_PER_REGION=${QUEUE_WORKER_BATCH_SIZE_PER_REGION:-10}
      - QUEUE_WORKER_MAX_REGIONS_PER_ITERATION=${QUEUE_WORKER_MAX_REGIONS_PER_ITERATION:-50}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 768m
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "node", "-e", "const redis=require('./utils/redis-pool'); redis.ensureConnection().then(()=>process.exit(0)).catch(()=>process.exit(1));"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 30s
    networks:
      - leaf-network

  sideeffects-worker:
    cpus: "0.75"
    mem_limit: 1024m

  billing-worker:
    cpus: "0.50"
    mem_limit: 768m

  nginx:
    cpus: "0.75"
    mem_limit: 512m
    volumes:
      - ./nginx.multi-gateway.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      websocket:
        condition: service_healthy
      websocket-gateway-2:
        condition: service_healthy
      websocket-gateway-3:
        condition: service_healthy
