    - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
    - DISPATCH_NOTIFY_CONCURRENCY=${DISPATCH_NOTIFY_CONCURRENCY:-24}
    - DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS=${DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS:-20}
    - SMOKE_DRIVER_RESPONSE_TIMEOUT_SECONDS=${SMOKE_DRIVER_RESPONSE_TIMEOUT_SECONDS:-21600}
    - DISPATCH_VERIFY_SOCKET_ROOM=${DISPATCH_VERIFY_SOCKET_ROOM:-false}
    - MATCH_DRIVERS_PER_WAVE=${MATCH_DRIVERS_PER_WAVE:-40}
    - MATCH_EXPANSION_INTERVAL_MS=${MATCH_EXPANSION_INTERVAL_MS:-250}
    - MATCH_EMPTY_WAVE_INTERVAL_MS=${MATCH_EMPTY_WAVE_INTERVAL_MS:-100}
    - MATCH_INITIAL_RADIUS_KM=${MATCH_INITIAL_RADIUS_KM:-2.0}
    - MATCH_EXPANSION_STEP_KM=${MATCH_EXPANSION_STEP_KM:-1.5}
    - DISPATCH_GEO_CANDIDATE_MIN=${DISPATCH_GEO_CANDIDATE_MIN:-320}
    - DISPATCH_GEO_CANDIDATE_MAX=${DISPATCH_GEO_CANDIDATE_MAX:-1000}
    - DISPATCH_SCORE_POOL_MIN=${DISPATCH_SCORE_POOL_MIN:-80}
    - DISPATCH_SCORE_POOL_MAX=${DISPATCH_SCORE_POOL_MAX:-280}
    - ENABLE_LEGACY_GRAPHQL=${ENABLE_LEGACY_GRAPHQL:-false}
    - ENABLE_LEGACY_DRIVER_RESPONSE_ACCEPT=${ENABLE_LEGACY_DRIVER_RESPONSE_ACCEPT:-false}
