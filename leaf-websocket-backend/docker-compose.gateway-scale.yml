services:
  redis:
    cpus: "0.75"
    mem_limit: 2048m

  websocket:
    cpus: "2.00"
    mem_limit: 2048m
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - RUNTIME_ROLE=gateway
      - LEAF_SERVER_RUNTIME=modular
      - ENABLE_EMBEDDED_LISTENER_WORKERS=false
      - ENABLE_DIRECT_RIDE_REQUESTED_DISPATCH=true
      - ENABLE_SOCKETIO_REDIS_ADAPTER=true
      - REQUIRE_SOCKETIO_REDIS_ADAPTER=true
      - SOCKET_ALLOW_POLLING=${SOCKET_ALLOW_POLLING:-false}
      - SOCKET_ADMISSION_ENABLED=${SOCKET_ADMISSION_ENABLED:-true}
      - SOCKET_ADMISSION_MAX_INFLIGHT=${SOCKET_ADMISSION_MAX_INFLIGHT:-900}
      - SOCKET_ADMISSION_MAX_QUEUE=${SOCKET_ADMISSION_MAX_QUEUE:-12000}
      - SOCKET_ADMISSION_MAX_WAIT_MS=${SOCKET_ADMISSION_MAX_WAIT_MS:-25000}
      - SOCKET_ADMISSION_HOLD_MS=${SOCKET_ADMISSION_HOLD_MS:-1000}
      - AUTH_VERIFY_ADMISSION_ENABLED=${AUTH_VERIFY_ADMISSION_ENABLED:-true}
      - AUTH_VERIFY_MAX_INFLIGHT=${AUTH_VERIFY_MAX_INFLIGHT:-600}
      - AUTH_VERIFY_MAX_QUEUE=${AUTH_VERIFY_MAX_QUEUE:-12000}
      - AUTH_VERIFY_MAX_WAIT_MS=${AUTH_VERIFY_MAX_WAIT_MS:-25000}
      - AUTH_VERIFY_BUSY_RETRY_ATTEMPTS=${AUTH_VERIFY_BUSY_RETRY_ATTEMPTS:-2}
      - AUTH_VERIFY_BUSY_RETRY_DELAY_MS=${AUTH_VERIFY_BUSY_RETRY_DELAY_MS:-200}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - DISPATCH_NOTIFY_CONCURRENCY=${DISPATCH_NOTIFY_CONCURRENCY:-24}
      - DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS=${DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS:-20}
      - DISPATCH_VERIFY_SOCKET_ROOM=${DISPATCH_VERIFY_SOCKET_ROOM:-false}
      - MATCH_DRIVERS_PER_WAVE=${MATCH_DRIVERS_PER_WAVE:-40}
      - MATCH_EXPANSION_INTERVAL_MS=${MATCH_EXPANSION_INTERVAL_MS:-250}
      - MATCH_EMPTY_WAVE_INTERVAL_MS=${MATCH_EMPTY_WAVE_INTERVAL_MS:-100}
      - MATCH_INITIAL_RADIUS_KM=${MATCH_INITIAL_RADIUS_KM:-2.0}
      - MATCH_EXPANSION_STEP_KM=${MATCH_EXPANSION_STEP_KM:-1.5}
      - DISPATCH_GEO_CANDIDATE_MIN=${DISPATCH_GEO_CANDIDATE_MIN:-320}
      - DISPATCH_GEO_CANDIDATE_MAX=${DISPATCH_GEO_CANDIDATE_MAX:-1000}
      - DISPATCH_SCORE_POOL_MIN=${DISPATCH_SCORE_POOL_MIN:-80}
      - DISPATCH_SCORE_POOL_MAX=${DISPATCH_SCORE_POOL_MAX:-280}
      - ENABLE_LEGACY_RUNTIME_ENDPOINTS=${ENABLE_LEGACY_RUNTIME_ENDPOINTS:-false}
      - ENABLE_LEGACY_UPDATE_DRIVER_LOCATION_EVENT=${ENABLE_LEGACY_UPDATE_DRIVER_LOCATION_EVENT:-false}
      - ENABLE_LEGACY_NO_DRIVERS_FOUND_EVENT=${ENABLE_LEGACY_NO_DRIVERS_FOUND_EVENT:-false}
      - ENABLE_LEGACY_AUTH_VERIFY_ROUTE=${ENABLE_LEGACY_AUTH_VERIFY_ROUTE:-false}
      - ENABLE_LEGACY_WOOVI_ALIAS_ROUTE=${ENABLE_LEGACY_WOOVI_ALIAS_ROUTE:-false}
      - ENABLE_LEGACY_SOCKET_BRIDGE=${ENABLE_LEGACY_SOCKET_BRIDGE:-false}
      - ENABLE_LEGACY_SOCKET_NOTIFICATIONS=${ENABLE_LEGACY_SOCKET_NOTIFICATIONS:-false}
      - ENABLE_LEGACY_PROMOTIONS_ROUTES=${ENABLE_LEGACY_PROMOTIONS_ROUTES:-false}
      - ENABLE_RIDE_EXTENSION_FLOW=${ENABLE_RIDE_EXTENSION_FLOW:-true}
      - ENABLE_RIDER_EARLY_END=${ENABLE_RIDER_EARLY_END:-true}
      - ENABLE_OPERATIONAL_REASSIGNMENT=${ENABLE_OPERATIONAL_REASSIGNMENT:-false}
      - ENABLE_MULTI_LEG_BILLING=${ENABLE_MULTI_LEG_BILLING:-false}
      - RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC=${RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC:-300}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - RUNTIME_ENABLE_QUEUE_WORKER=false
      - ENABLE_RUNTIME_RADIUS_EXPANSION_MANAGER=true
      - ENABLE_DRIVER_POOL_MONITOR=true
      - ENABLE_ACCEPTED_RIDE_RECOVERY_MONITOR=true
      - ENABLE_RUNTIME_DEMAND_NOTIFICATION_SERVICE=true
      - ENABLE_RUNTIME_DASHBOARD_WEBSOCKET=true
      - ENABLE_RUNTIME_CLEANUP_JOB=true
      - ENABLE_CONNECTION_CLEANUP_SERVICE=true
      - DAILY_EARNINGS_REPORT_ENABLED=${DAILY_EARNINGS_REPORT_ENABLED:-true}
      - RIDE_FINALIZATION_OUTBOX_ENABLED=${RIDE_FINALIZATION_OUTBOX_ENABLED:-true}

  websocket-secondary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaf-websocket-secondary
    command: ["bash", "./scripts/runtime/start-server.sh"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - RUNTIME_ROLE=gateway
      - LEAF_SERVER_RUNTIME=modular
      - ENABLE_EMBEDDED_LISTENER_WORKERS=false
      - RUNTIME_ENABLE_QUEUE_WORKER=false
      - ENABLE_DIRECT_RIDE_REQUESTED_DISPATCH=true
      - ENABLE_SOCKETIO_REDIS_ADAPTER=true
      - REQUIRE_SOCKETIO_REDIS_ADAPTER=true
      - SOCKET_ALLOW_POLLING=${SOCKET_ALLOW_POLLING:-false}
      - SOCKET_ADMISSION_ENABLED=${SOCKET_ADMISSION_ENABLED:-true}
      - SOCKET_ADMISSION_MAX_INFLIGHT=${SOCKET_ADMISSION_MAX_INFLIGHT:-900}
      - SOCKET_ADMISSION_MAX_QUEUE=${SOCKET_ADMISSION_MAX_QUEUE:-12000}
      - SOCKET_ADMISSION_MAX_WAIT_MS=${SOCKET_ADMISSION_MAX_WAIT_MS:-25000}
      - SOCKET_ADMISSION_HOLD_MS=${SOCKET_ADMISSION_HOLD_MS:-1000}
      - AUTH_VERIFY_ADMISSION_ENABLED=${AUTH_VERIFY_ADMISSION_ENABLED:-true}
      - AUTH_VERIFY_MAX_INFLIGHT=${AUTH_VERIFY_MAX_INFLIGHT:-600}
      - AUTH_VERIFY_MAX_QUEUE=${AUTH_VERIFY_MAX_QUEUE:-12000}
      - AUTH_VERIFY_MAX_WAIT_MS=${AUTH_VERIFY_MAX_WAIT_MS:-25000}
      - AUTH_VERIFY_BUSY_RETRY_ATTEMPTS=${AUTH_VERIFY_BUSY_RETRY_ATTEMPTS:-2}
      - AUTH_VERIFY_BUSY_RETRY_DELAY_MS=${AUTH_VERIFY_BUSY_RETRY_DELAY_MS:-200}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - DISPATCH_NOTIFY_CONCURRENCY=${DISPATCH_NOTIFY_CONCURRENCY:-24}
      - DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS=${DISPATCH_DRIVER_RESPONSE_TIMEOUT_SECONDS:-20}
      - DISPATCH_VERIFY_SOCKET_ROOM=${DISPATCH_VERIFY_SOCKET_ROOM:-false}
      - MATCH_DRIVERS_PER_WAVE=${MATCH_DRIVERS_PER_WAVE:-40}
      - MATCH_EXPANSION_INTERVAL_MS=${MATCH_EXPANSION_INTERVAL_MS:-250}
      - MATCH_EMPTY_WAVE_INTERVAL_MS=${MATCH_EMPTY_WAVE_INTERVAL_MS:-100}
      - MATCH_INITIAL_RADIUS_KM=${MATCH_INITIAL_RADIUS_KM:-2.0}
      - MATCH_EXPANSION_STEP_KM=${MATCH_EXPANSION_STEP_KM:-1.5}
      - DISPATCH_GEO_CANDIDATE_MIN=${DISPATCH_GEO_CANDIDATE_MIN:-320}
      - DISPATCH_GEO_CANDIDATE_MAX=${DISPATCH_GEO_CANDIDATE_MAX:-1000}
      - DISPATCH_SCORE_POOL_MIN=${DISPATCH_SCORE_POOL_MIN:-80}
      - DISPATCH_SCORE_POOL_MAX=${DISPATCH_SCORE_POOL_MAX:-280}
      - ENABLE_LEGACY_RUNTIME_ENDPOINTS=${ENABLE_LEGACY_RUNTIME_ENDPOINTS:-false}
      - ENABLE_LEGACY_UPDATE_DRIVER_LOCATION_EVENT=${ENABLE_LEGACY_UPDATE_DRIVER_LOCATION_EVENT:-false}
      - ENABLE_LEGACY_NO_DRIVERS_FOUND_EVENT=${ENABLE_LEGACY_NO_DRIVERS_FOUND_EVENT:-false}
      - ENABLE_LEGACY_AUTH_VERIFY_ROUTE=${ENABLE_LEGACY_AUTH_VERIFY_ROUTE:-false}
      - ENABLE_LEGACY_WOOVI_ALIAS_ROUTE=${ENABLE_LEGACY_WOOVI_ALIAS_ROUTE:-false}
      - ENABLE_LEGACY_SOCKET_BRIDGE=${ENABLE_LEGACY_SOCKET_BRIDGE:-false}
      - ENABLE_LEGACY_SOCKET_NOTIFICATIONS=${ENABLE_LEGACY_SOCKET_NOTIFICATIONS:-false}
      - ENABLE_LEGACY_PROMOTIONS_ROUTES=${ENABLE_LEGACY_PROMOTIONS_ROUTES:-false}
      - ENABLE_RIDE_EXTENSION_FLOW=${ENABLE_RIDE_EXTENSION_FLOW:-true}
      - ENABLE_RIDER_EARLY_END=${ENABLE_RIDER_EARLY_END:-true}
      - ENABLE_OPERATIONAL_REASSIGNMENT=${ENABLE_OPERATIONAL_REASSIGNMENT:-false}
      - ENABLE_MULTI_LEG_BILLING=${ENABLE_MULTI_LEG_BILLING:-false}
      - RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC=${RIDE_EXTENSION_PAYMENT_TIMEOUT_SEC:-300}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_RUNTIME_RADIUS_EXPANSION_MANAGER=false
      - ENABLE_DRIVER_POOL_MONITOR=false
      - ENABLE_ACCEPTED_RIDE_RECOVERY_MONITOR=false
      - ENABLE_RUNTIME_DEMAND_NOTIFICATION_SERVICE=false
      - ENABLE_RUNTIME_DASHBOARD_WEBSOCKET=false
      - ENABLE_RUNTIME_CLEANUP_JOB=false
      - ENABLE_CONNECTION_CLEANUP_SERVICE=false
      - DAILY_EARNINGS_REPORT_ENABLED=false
      - RIDE_FINALIZATION_OUTBOX_ENABLED=false
      - SUBSCRIPTION_DAILY_BILLING_ENABLED=false
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: "2.00"
    mem_limit: 2048m
    pids_limit: 512
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - leaf-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaf-queue-worker
    command: ["node", "workers/queue-worker-process.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RUNTIME_ROLE=queue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - ENABLE_SOCKETIO_REDIS_ADAPTER=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - QUEUE_WORKER_INTERVAL_MS=${QUEUE_WORKER_INTERVAL_MS:-1000}
      - QUEUE_WORKER_BATCH_SIZE_PER_REGION=${QUEUE_WORKER_BATCH_SIZE_PER_REGION:-10}
      - QUEUE_WORKER_MAX_REGIONS_PER_ITERATION=${QUEUE_WORKER_MAX_REGIONS_PER_ITERATION:-50}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 768m
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "node", "-e", "const redis=require('./utils/redis-pool'); redis.ensureConnection().then(()=>process.exit(0)).catch(()=>process.exit(1));"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 30s
    networks:
      - leaf-network

  sideeffects-worker:
    cpus: "0.75"
    mem_limit: 1024m

  billing-worker:
    cpus: "0.50"
    mem_limit: 768m

  nginx:
    cpus: "1.00"
    volumes:
      - ./nginx.multi-gateway.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      websocket:
        condition: service_healthy
      websocket-secondary:
        condition: service_healthy
