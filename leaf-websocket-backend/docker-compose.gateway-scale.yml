    - KYC_AWS_COMPARE_RESULT_PERSIST_MAX_ATTEMPTS=${KYC_AWS_COMPARE_RESULT_PERSIST_MAX_ATTEMPTS:-3}
    - KYC_AWS_COST_GUARD_ENABLED=${KYC_AWS_COST_GUARD_ENABLED:-false}
    - KYC_AWS_COST_DAILY_LIMIT_USD=${KYC_AWS_COST_DAILY_LIMIT_USD:-2.50}
    - KYC_AWS_COST_MONTHLY_LIMIT_USD=${KYC_AWS_COST_MONTHLY_LIMIT_USD:-50.00}
    - KYC_AWS_COST_TIME_ZONE=${KYC_AWS_COST_TIME_ZONE:-UTC}
    - KYC_AWS_COST_OPERATION_RETENTION_DAYS=${KYC_AWS_COST_OPERATION_RETENTION_DAYS:-35}
    - KYC_CANONICAL_TRUSTED_BIOMETRIC_MATCH_PROVIDERS=${KYC_CANONICAL_TRUSTED_BIOMETRIC_MATCH_PROVIDERS:-biometric-face-service,leaf_face_compare_service,aws_rekognition_compare_faces}
    - DAILY_KYC_ONLINE_GATE_ENABLED=${DAILY_KYC_ONLINE_GATE_ENABLED:-false}
    - KYC_TRUST_CADENCE_ENABLED=${KYC_TRUST_CADENCE_ENABLED:-false}
    - ENABLE_ACTIVE_TRIP_INDEX=${ENABLE_ACTIVE_TRIP_INDEX:-true}
    - KYC_ACTIVE_TRIP_AUTHORITY_MODE=${KYC_ACTIVE_TRIP_AUTHORITY_MODE:-}
    - REDIS_CRITICAL_AUTHORITY_ATTESTATION_ENABLED=${REDIS_CRITICAL_AUTHORITY_ATTESTATION_ENABLED:-false}
    - REDIS_CRITICAL_DATASET_QUARANTINE_ENABLED=${REDIS_CRITICAL_DATASET_QUARANTINE_ENABLED:-false}
    - REDIS_CRITICAL_DATASET_GENERATION=${REDIS_CRITICAL_DATASET_GENERATION:-}
    - REDIS_CRITICAL_DATASET_GENERATION_KEY=${REDIS_CRITICAL_DATASET_GENERATION_KEY:-leaf:runtime:critical-dataset:generation}
    - REDIS_CRITICAL_MEMORY_WARNING_PERCENT=${REDIS_CRITICAL_MEMORY_WARNING_PERCENT:-60}
    - REDIS_CRITICAL_MEMORY_HIGH_PERCENT=${REDIS_CRITICAL_MEMORY_HIGH_PERCENT:-75}
    - REDIS_CRITICAL_MEMORY_CRITICAL_PERCENT=${REDIS_CRITICAL_MEMORY_CRITICAL_PERCENT:-85}
    - REDIS_CRITICAL_ATTESTATION_CACHE_TTL_MS=${REDIS_CRITICAL_ATTESTATION_CACHE_TTL_MS:-5000}
    - ENABLE_TRIP_LOCATION_STREAM=${ENABLE_TRIP_LOCATION_STREAM:-true}
    - TRIP_LOCATION_WORKER_GROUP=${TRIP_LOCATION_WORKER_GROUP:-trip-location-workers}
    - TRIP_LOCATION_CONSUMER_MAX_IDLE_MS=${TRIP_LOCATION_CONSUMER_MAX_IDLE_MS:-30000}
    - TRIP_LOCATION_STREAM_SAFE_TRIM_THRESHOLD=${TRIP_LOCATION_STREAM_SAFE_TRIM_THRESHOLD:-500000}
    - ENABLE_TRIP_LOCATION_PERSISTENCE_WORKER=${ENABLE_TRIP_LOCATION_PERSISTENCE_WORKER:-true}
    - ENABLE_TRIP_LOCATION_FIRESTORE_PERSISTENCE=${ENABLE_TRIP_LOCATION_FIRESTORE_PERSISTENCE:-true}
    - TRIP_LOCATION_WORKER_HEALTH_KEY=${TRIP_LOCATION_WORKER_HEALTH_KEY:-leaf:runtime:trip-location-worker:health}
    - TRIP_LOCATION_WORKER_HEALTH_MAX_AGE_MS=${TRIP_LOCATION_WORKER_HEALTH_MAX_AGE_MS:-45000}
    - KYC_TRUST_POLICY_VERSION=${KYC_TRUST_POLICY_VERSION:-driver_identity_recurring_v1}
    - KYC_TRUST_T0_MAX_AGE_HOURS=${KYC_TRUST_T0_MAX_AGE_HOURS:-24}
    - KYC_TRUST_T1_MAX_AGE_HOURS=${KYC_TRUST_T1_MAX_AGE_HOURS:-72}
    - KYC_TRUST_T2_MAX_AGE_HOURS=${KYC_TRUST_T2_MAX_AGE_HOURS:-168}
    - KYC_TRUST_T1_MIN_DISTINCT_SUCCESS_DAYS=${KYC_TRUST_T1_MIN_DISTINCT_SUCCESS_DAYS:-7}
    - KYC_TRUST_T2_MIN_AGE_DAYS=${KYC_TRUST_T2_MIN_AGE_DAYS:-30}
    - KYC_TRUST_T2_MIN_SUCCESS_COUNT=${KYC_TRUST_T2_MIN_SUCCESS_COUNT:-14}
    - KYC_TRUST_T2_MIN_DISTINCT_SUCCESS_DAYS=${KYC_TRUST_T2_MIN_DISTINCT_SUCCESS_DAYS:-14}
    - KYC_TRUSTED_RANDOM_AUDIT_PERCENT=${KYC_TRUSTED_RANDOM_AUDIT_PERCENT:-10}
    - KYC_TRUST_RANDOM_AUDIT_TIME_ZONE=${KYC_TRUST_RANDOM_AUDIT_TIME_ZONE:-America/Sao_Paulo}
    - KYC_TRUST_RANDOM_AUDIT_DECISION_TTL_SECONDS=${KYC_TRUST_RANDOM_AUDIT_DECISION_TTL_SECONDS:-172800}
    - KYC_TRUST_STATE_CACHE_TTL_SECONDS=${KYC_TRUST_STATE_CACHE_TTL_SECONDS:-300}
    - KYC_CANONICAL_SESSION_CLAIM_TTL_SECONDS=${KYC_CANONICAL_SESSION_CLAIM_TTL_SECONDS:-120}
    - KYC_IDENTITY_VERIFICATION_WINDOW_TTL_SECONDS=${KYC_IDENTITY_VERIFICATION_WINDOW_TTL_SECONDS:-1500}
    - ENABLE_LEGACY_KYC_PROXY=${ENABLE_LEGACY_KYC_PROXY:-false}
    # Biometria facial InsightFace/FastAPI
    # Mantem runtime-config/KYC consistente entre todos os gateways.
    - KYC_VPS_PROVIDER=${KYC_VPS_PROVIDER:-auto}
    - BIOMETRIC_FACE_SERVICE_URL=${BIOMETRIC_FACE_SERVICE_URL:-}
    - BIOMETRIC_FACE_SERVICE_API_KEY=${BIOMETRIC_FACE_SERVICE_API_KEY:-}
    - BIOMETRIC_FACE_SERVICE_API_KEY_HEADER=${BIOMETRIC_FACE_SERVICE_API_KEY_HEADER:-X-Leaf-Biometric-Key}
    - BIOMETRIC_FACE_SERVICE_TIMEOUT_MS=${BIOMETRIC_FACE_SERVICE_TIMEOUT_MS:-90000}
    - BIOMETRIC_FACE_APPROVE_THRESHOLD=${BIOMETRIC_FACE_APPROVE_THRESHOLD:-0.61}
    - BIOMETRIC_FACE_REVIEW_THRESHOLD=${BIOMETRIC_FACE_REVIEW_THRESHOLD:-0.40}
    - BIOMETRIC_SERVER_SIDE_MAX_CONCURRENCY=${BIOMETRIC_SERVER_SIDE_MAX_CONCURRENCY:-4}
    - BIOMETRIC_SERVER_SIDE_MAX_QUEUE=${BIOMETRIC_SERVER_SIDE_MAX_QUEUE:-250}
    - MOBILE_FACE_EMBEDDING_ENABLED=${MOBILE_FACE_EMBEDDING_ENABLED:-true}
    - MOBILE_FACE_EMBEDDING_ALLOWED_MODES=${MOBILE_FACE_EMBEDDING_ALLOWED_MODES:-mobile_arcface_w600k_r50_v1,device_embedding_v1}
    - MOBILE_FACE_EMBEDDING_FORMAT=${MOBILE_FACE_EMBEDDING_FORMAT:-float32-l2-normalized-512}
    - MOBILE_FACE_EMBEDDING_DIMENSION=${MOBILE_FACE_EMBEDDING_DIMENSION:-512}
    - MOBILE_FACE_EMBEDDING_NORM_MIN=${MOBILE_FACE_EMBEDDING_NORM_MIN:-0.95}
    - MOBILE_FACE_EMBEDDING_NORM_MAX=${MOBILE_FACE_EMBEDDING_NORM_MAX:-1.05}
    - MOBILE_FACE_EMBEDDING_LOCAL_COMPARE_FALLBACK=${MOBILE_FACE_EMBEDDING_LOCAL_COMPARE_FALLBACK:-true}
    - KYC_PRODUCTION_BIOMETRICS_ENABLED=${KYC_PRODUCTION_BIOMETRICS_ENABLED:-false}
    - KYC_STRICT_PRODUCTION_MODE=${KYC_STRICT_PRODUCTION_MODE:-false}
    - KYC_REQUIRE_TRUSTED_BIOMETRIC_MATCH=${KYC_REQUIRE_TRUSTED_BIOMETRIC_MATCH:-false}
    - KYC_ALLOW_LEGACY_DEVICE_SIGNATURE=${KYC_ALLOW_LEGACY_DEVICE_SIGNATURE:-true}
    - KYC_ALLOW_AWS_LIVENESS_ONLY_MATCH=${KYC_ALLOW_AWS_LIVENESS_ONLY_MATCH:-true}
    - KYC_TRUSTED_BIOMETRIC_MATCH_PROVIDERS=${KYC_TRUSTED_BIOMETRIC_MATCH_PROVIDERS:-mobile_face_embedding,biometric-face-service,leaf_face_compare_service}
    - ENABLE_CNH_FACE_BIOMETRICS=${ENABLE_CNH_FACE_BIOMETRICS:-false}
    - CNH_FACE_BIOMETRICS_BLOCKING=${CNH_FACE_BIOMETRICS_BLOCKING:-false}
    - CNH_DIGITAL_PHOTO_CROP_LEFT=${CNH_DIGITAL_PHOTO_CROP_LEFT:-0.200044}
    - CNH_DIGITAL_PHOTO_CROP_TOP=${CNH_DIGITAL_PHOTO_CROP_TOP:-0.404421}
    - CNH_DIGITAL_PHOTO_CROP_WIDTH=${CNH_DIGITAL_PHOTO_CROP_WIDTH:-0.219841}
    - CNH_DIGITAL_PHOTO_CROP_HEIGHT=${CNH_DIGITAL_PHOTO_CROP_HEIGHT:-0.396786}
    - ENABLE_RUNTIME_RADIUS_EXPANSION_MANAGER=false
    - ENABLE_DRIVER_POOL_MONITOR=false
    - ENABLE_ACCEPTED_RIDE_RECOVERY_MONITOR=false
    - ENABLE_RUNTIME_DEMAND_NOTIFICATION_SERVICE=false
    - ENABLE_RUNTIME_DASHBOARD_WEBSOCKET=false
    - ENABLE_RUNTIME_CLEANUP_JOB=false
    - ENABLE_CONNECTION_CLEANUP_SERVICE=false
    - DAILY_EARNINGS_REPORT_ENABLED=false
    - RIDE_FINALIZATION_OUTBOX_ENABLED=false
    - SUBSCRIPTION_DAILY_BILLING_ENABLED=false
  volumes:
    - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    - ./logs:/app/logs
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped
  cpus: "1.10"
  mem_limit: 1536m
  pids_limit: 512
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3001/health/liveness"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  networks:
    - leaf-network

services:
  redis:
    cpus: "0.75"
    # Minimum headroom above maxmemory=2304mb; pressure/COW validation is still required.
    mem_limit: 3072m

  websocket:
    cpus: "1.10"
    mem_limit: 1536m
    env_file:
      - .env
