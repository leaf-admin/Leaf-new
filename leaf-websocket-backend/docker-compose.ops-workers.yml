    environment:
      - NODE_ENV=production
      - RUNTIME_ROLE=pricing-baseline
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/${REDIS_DB:-0}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - REDIS_SENTINELS=${REDIS_SENTINELS:-}
      - REDIS_SENTINEL_MASTER_NAME=${REDIS_SENTINEL_MASTER_NAME:-leaf-master}
      - REDIS_SENTINEL_USERNAME=${REDIS_SENTINEL_USERNAME:-}
      - REDIS_SENTINEL_PASSWORD=${REDIS_SENTINEL_PASSWORD:-}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_USE_TLS=${REDIS_USE_TLS:-false}
      - REDIS_TLS_REJECT_UNAUTHORIZED=${REDIS_TLS_REJECT_UNAUTHORIZED:-true}
      - REDIS_SENTINEL_USE_TLS=${REDIS_SENTINEL_USE_TLS:-false}
      - REDIS_SENTINEL_TLS_REJECT_UNAUTHORIZED=${REDIS_SENTINEL_TLS_REJECT_UNAUTHORIZED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_PRICING_BASELINE_WORKER=${ENABLE_PRICING_BASELINE_WORKER:-true}
      - PRICING_BASELINE_WORKER_INTERVAL_MS=${PRICING_BASELINE_WORKER_INTERVAL_MS:-300000}
      - PRICING_BASELINE_WORKER_RUN_ON_BOOT=${PRICING_BASELINE_WORKER_RUN_ON_BOOT:-true}
      - PRICING_BASELINE_WORKER_LEADER_KEY=${PRICING_BASELINE_WORKER_LEADER_KEY:-leaf:runtime:pricing-baseline-worker:leader}
      - PRICING_BASELINE_WORKER_LEADER_TTL_MS=${PRICING_BASELINE_WORKER_LEADER_TTL_MS:-60000}
      - PRICING_BASELINE_WORKER_LEADER_RENEW_INTERVAL_MS=${PRICING_BASELINE_WORKER_LEADER_RENEW_INTERVAL_MS:-20000}
      - LEAF_WORKER_INSTANCE_ID=${LEAF_WORKER_INSTANCE_ID:-}
      - PRICING_BASELINE_MAX_CELLS=${PRICING_BASELINE_MAX_CELLS:-250}
      - PRICING_BASELINE_ROUTE_DISTANCE_KM=${PRICING_BASELINE_ROUTE_DISTANCE_KM:-1.5}
      - PRICING_BASELINE_ROUTE_DURATION_SECS=${PRICING_BASELINE_ROUTE_DURATION_SECS:-240}
      - PRICING_H3_RESOLUTION=${PRICING_H3_RESOLUTION:-9}
      - PRICING_H3_RING_SIZE=${PRICING_H3_RING_SIZE:-1}
      - PRICING_H3_BASELINE_RING_SIZE=${PRICING_H3_BASELINE_RING_SIZE:-2}
      - PRICING_BASELINE_ALPHA=${PRICING_BASELINE_ALPHA:-0.18}
      - PRICING_HISTORY_MAX_POINTS=${PRICING_HISTORY_MAX_POINTS:-20}
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      websocket:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.60"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "node", "-e", "const redis=require('./utils/redis-pool'); redis.ensureConnection().then(()=>process.exit(0)).catch(()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - leaf-network

