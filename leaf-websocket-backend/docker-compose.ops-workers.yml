services:
  trip-location-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: leaf-trip-location-worker
    command: ["node", "workers/worker-trip-location.js"]
    environment:
      - NODE_ENV=production
      - RUNTIME_ROLE=trip-location
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/${REDIS_DB:-0}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - REDIS_SENTINELS=${REDIS_SENTINELS:-}
      - REDIS_SENTINEL_MASTER_NAME=${REDIS_SENTINEL_MASTER_NAME:-leaf-master}
      - REDIS_SENTINEL_USERNAME=${REDIS_SENTINEL_USERNAME:-}
      - REDIS_SENTINEL_PASSWORD=${REDIS_SENTINEL_PASSWORD:-}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_USE_TLS=${REDIS_USE_TLS:-false}
      - REDIS_TLS_REJECT_UNAUTHORIZED=${REDIS_TLS_REJECT_UNAUTHORIZED:-true}
      - REDIS_SENTINEL_USE_TLS=${REDIS_SENTINEL_USE_TLS:-false}
      - REDIS_SENTINEL_TLS_REJECT_UNAUTHORIZED=${REDIS_SENTINEL_TLS_REJECT_UNAUTHORIZED:-true}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-leaf-app-91dfdce0}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://leaf-reactnative-default-rtdb.firebaseio.com}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_TRIP_LOCATION_PERSISTENCE_WORKER=${ENABLE_TRIP_LOCATION_PERSISTENCE_WORKER:-true}
      - ENABLE_TRIP_LOCATION_FIRESTORE_PERSISTENCE=${ENABLE_TRIP_LOCATION_FIRESTORE_PERSISTENCE:-true}
      - LEAF_WORKER_INSTANCE_ID=${LEAF_WORKER_INSTANCE_ID:-}
      - TRIP_LOCATION_STREAM_NAME=${TRIP_LOCATION_STREAM_NAME:-trip_location_events}
      - TRIP_LOCATION_WORKER_GROUP=${TRIP_LOCATION_WORKER_GROUP:-trip-location-workers}
      - TRIP_LOCATION_WORKER_CONSUMER=${TRIP_LOCATION_WORKER_CONSUMER:-}
      - TRIP_LOCATION_WORKER_DLQ_STREAM_NAME=${TRIP_LOCATION_WORKER_DLQ_STREAM_NAME:-trip_location_events_dlq}
      - TRIP_LOCATION_CONSUMER_MAX_IDLE_MS=${TRIP_LOCATION_CONSUMER_MAX_IDLE_MS:-30000}
      - TRIP_LOCATION_WORKER_HEALTH_KEY=${TRIP_LOCATION_WORKER_HEALTH_KEY:-leaf:runtime:trip-location-worker:health}
      - TRIP_LOCATION_WORKER_HEALTH_TTL_SECONDS=${TRIP_LOCATION_WORKER_HEALTH_TTL_SECONDS:-90}
      - TRIP_LOCATION_WORKER_HEALTH_MAX_AGE_MS=${TRIP_LOCATION_WORKER_HEALTH_MAX_AGE_MS:-45000}
      - TRIP_LOCATION_WORKER_BATCH_SIZE=${TRIP_LOCATION_WORKER_BATCH_SIZE:-40}
      - TRIP_LOCATION_WORKER_BLOCK_TIME=${TRIP_LOCATION_WORKER_BLOCK_TIME:-1000}
      - TRIP_LOCATION_WORKER_MAX_RETRIES=${TRIP_LOCATION_WORKER_MAX_RETRIES:-4}
      - TRIP_LOCATION_CHUNK_SIZE=${TRIP_LOCATION_CHUNK_SIZE:-30}
      - TRIP_LOCATION_BUFFER_TTL_SECONDS=${TRIP_LOCATION_BUFFER_TTL_SECONDS:-86400}
      - TRIP_LOCATION_WORKER_IDEMPOTENCY_TTL_SECONDS=${TRIP_LOCATION_WORKER_IDEMPOTENCY_TTL_SECONDS:-86400}
      - TRIP_LOCATION_FLUSH_LOCK_TTL_SECONDS=${TRIP_LOCATION_FLUSH_LOCK_TTL_SECONDS:-15}
      - TRIP_LOCATION_FLUSH_MAX_TRIPS_PER_CYCLE=${TRIP_LOCATION_FLUSH_MAX_TRIPS_PER_CYCLE:-200}
      - TRIP_LOCATION_FLUSH_MAX_CHUNKS_PER_TRIP=${TRIP_LOCATION_FLUSH_MAX_CHUNKS_PER_TRIP:-4}
      - TRIP_LOCATION_CHUNK_RETENTION_DAYS=${TRIP_LOCATION_CHUNK_RETENTION_DAYS:-30}
      - TRIP_LOCATION_PERIODIC_FLUSH_MS=${TRIP_LOCATION_PERIODIC_FLUSH_MS:-15000}
      - TRIP_LOCATION_STATS_LOG_MS=${TRIP_LOCATION_STATS_LOG_MS:-60000}
      - WORKER_STREAM_SAFE_TRIM_THRESHOLD=${TRIP_LOCATION_STREAM_SAFE_TRIM_THRESHOLD:-500000}
      - WORKER_STREAM_TRIM_CHECK_EVERY_ACKS=${WORKER_STREAM_TRIM_CHECK_EVERY_ACKS:-5000}
      - WORKER_DLQ_MAXLEN=${WORKER_DLQ_MAXLEN:-10000}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.50"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD", "node", "-e", "const pool=require('./utils/redis-pool'); const {buildWorkerConsumerName}=require('./workers/worker-consumer-identity'); const parse=(row)=>{const value={}; for(let i=0;i<row.length;i+=2)value[row[i]]=row[i+1]; return value;}; (async()=>{await pool.ensureConnection(); const redis=pool.getConnection(); const stream=process.env.TRIP_LOCATION_STREAM_NAME||'trip_location_events'; const group=process.env.TRIP_LOCATION_WORKER_GROUP||'trip-location-workers'; const consumer=process.env.TRIP_LOCATION_WORKER_CONSUMER||buildWorkerConsumerName('trip-location-worker',{includePid:false}); const maxIdleMs=Number(process.env.TRIP_LOCATION_CONSUMER_MAX_IDLE_MS||30000); const healthKey=process.env.TRIP_LOCATION_WORKER_HEALTH_KEY||'leaf:runtime:trip-location-worker:health'; const maxHealthAgeMs=Number(process.env.TRIP_LOCATION_WORKER_HEALTH_MAX_AGE_MS||45000); if(!Number.isInteger(maxIdleMs)||maxIdleMs<1000||!Number.isInteger(maxHealthAgeMs)||maxHealthAgeMs<1000)throw new Error('invalid health limits'); const consumers=(await redis.xinfo('CONSUMERS',stream,group)).map(parse); const own=consumers.find((entry)=>entry.name===consumer); if(!own||!Number.isFinite(Number(own.idle))||Number(own.idle)>maxIdleMs)throw new Error('trip-location consumer inactive'); const health=await redis.hgetall(healthKey); const heartbeatAt=Number(health.heartbeatAt); const heartbeatAgeMs=Date.now()-heartbeatAt; if(!['healthy','idle'].includes(String(health.status||''))||!Number.isInteger(heartbeatAt)||heartbeatAt<=0||heartbeatAgeMs<0||heartbeatAgeMs>maxHealthAgeMs)throw new Error('trip-location persistence heartbeat unhealthy');})().then(()=>process.exit(0)).catch(()=>process.exit(1));"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 30s
    networks:
      - leaf-network

  pricing-baseline-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: leaf-pricing-baseline-worker
