<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ground Shadow -->
  <rect x="130" y="40" width="252" height="432" rx="60" fill="#000000" opacity="0.15"/>

  <!-- Tires -->
  <rect x="115" y="90" width="30" height="70" rx="8" fill="#1c2022"/>
  <rect x="367" y="90" width="30" height="70" rx="8" fill="#1c2022"/>
  <rect x="115" y="350" width="30" height="70" rx="8" fill="#1c2022"/>
  <rect x="367" y="350" width="30" height="70" rx="8" fill="#1c2022"/>

  <!-- Main Car Body -->
  <path d="M 140 100
           C 140 50, 160 30, 256 30
           C 352 30, 372 50, 372 100
           L 372 410
           C 372 460, 340 480, 256 480
           C 172 480, 140 460, 140 410 Z"
        fill="#111111"/>

  <!-- Side Mirrors -->
  <rect x="105" y="140" width="36" height="16" rx="6" fill="#111111"/>
  <rect x="371" y="140" width="36" height="16" rx="6" fill="#111111"/>

  <!-- Front Windshield -->
  <path d="M 160 130
           L 352 130
           L 332 185
           L 180 185 Z"
        fill="#37474f"/>

  <!-- Side Windows -->
  <path d="M 155 195 L 175 195 L 175 330 L 155 310 Z" fill="#263238"/>
  <path d="M 357 195 L 337 195 L 337 330 L 357 310 Z" fill="#263238"/>

  <!-- Rear Window -->
  <path d="M 180 340
           L 332 340
           L 352 385
           L 160 385 Z"
        fill="#37474f"/>

  <!-- Car Roof -->
  <rect x="180" y="195" width="152" height="135" rx="10" fill="#111111"/>

  <!-- Hood Lines -->
  <path d="M 180 45 L 190 115" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <path d="M 332 45 L 322 115" stroke="#222222" stroke-width="3" stroke-linecap="round"/>

  <!-- Headlights -->
  <path d="M 150 35 Q 170 32 190 36" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 362 35 Q 342 32 322 36" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Taillights -->
  <rect x="145" y="470" width="35" height="6" rx="2" fill="#d32f2f"/>
  <rect x="332" y="470" width="35" height="6" rx="2" fill="#d32f2f"/>

  <!-- Leaf windshield sticker -->
  <rect x="300" y="140" width="22" height="22" rx="4" fill="#ffffff"/>
  <rect x="303" y="143" width="16" height="16" rx="2" fill="#000000"/>
  <text x="311" y="156" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle">L</text>
</svg>
