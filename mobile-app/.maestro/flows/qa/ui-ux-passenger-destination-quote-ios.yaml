appId: br.com.leaf.ride
---
- extendedWaitUntil:
    visible:
      id: "passenger-destination-search-input"
    timeout: 30000

- takeScreenshot: "qa-artifacts/ui-ux-simulator-2026-07-11/interaction/debug/passenger-destination-search"

- tapOn:
    id: "passenger-destination-search-input"
- eraseText
- inputText: "Leblon"

- runFlow:
    when:
      visible: "Type português e inglês"
    commands:
      - tapOn: "Continue"

- extendedWaitUntil:
    visible: ".*Leblon.*"
    timeout: 30000

- takeScreenshot: "qa-artifacts/ui-ux-simulator-2026-07-11/interaction/debug/passenger-destination-results-keyboard"

- tapOn:
    id: "passenger-destination-result-0"

- extendedWaitUntil:
    visible: ".*(Confirmar|Solicitar .*|Confirme sua viagem|Realize seu pagamento).*"
    timeout: 120000

- takeScreenshot: "qa-artifacts/ui-ux-simulator-2026-07-11/interaction/debug/passenger-quote"
