appId: br.com.leaf.ride
---
- openLink: "leafapp://robotaxi/receipt"

- extendedWaitUntil:
    visible: ".*(Resumo da viagem|Corrida finalizada|PIX recebido|Corrida conclu[ií]da|Avalie o passageiro).*"
    timeout: 180000

- runFlow:
    when:
      visible:
        id: "driver-receipt-rate-passenger-button"
    commands:
      - tapOn:
          id: "driver-receipt-rate-passenger-button"

- extendedWaitUntil:
    visible: ".*(Avalie o passageiro|Enviar avaliacao|Avaliação enviada|Avaliacao enviada|Avaliação já enviada|Avaliacao ja enviada|Avaliado).*"
    timeout: 30000

- runFlow:
    when:
      visible:
        id: "passenger-rating-submit-button"
    commands:
      - tapOn:
          id: "passenger-rating-submit-button"

- runFlow:
    when:
      visible: "Enviar avaliacao"
    commands:
      - tapOn: "Enviar avaliacao"

- extendedWaitUntil:
    visible: ".*(Avaliação enviada|Avaliacao enviada|Avaliação já enviada|Avaliacao ja enviada|Avaliado|Resumo da viagem|Corrida finalizada).*"
    timeout: 15000

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- extendedWaitUntil:
    visible: ".*(Resumo da viagem|Corrida finalizada|Avaliação enviada|Avaliacao enviada|Avaliado|Reportar problema).*"
    timeout: 60000
