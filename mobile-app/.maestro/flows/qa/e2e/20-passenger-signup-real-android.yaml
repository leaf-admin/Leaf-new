appId: br.com.leaf.ride
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "(onboarding-welcome-start|auth-phone-input)"
    timeout: 120000

- runFlow:
    when:
      visible:
        id: "onboarding-welcome-start"
    commands:
      - tapOn:
          id: "onboarding-welcome-start"

- extendedWaitUntil:
    visible:
      id: "auth-phone-input"
    timeout: 120000

- tapOn:
    id: "auth-phone-input"
- eraseText
- inputText: ${PASSENGER_PHONE}
- tapOn:
    id: "auth-continue-btn"

- runFlow:
    when:
      visible: "Erro de Autenticacao"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd
      - tapOn:
          id: "auth-continue-btn"

- runFlow:
    when:
      visible: "Erro de Conexao"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd
      - tapOn:
          id: "auth-continue-btn"

- runFlow:
    when:
      visible: "Estamos com instabilidade no servidor.*"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd
      - tapOn:
          id: "auth-continue-btn"

- runFlow:
    when:
      visible:
        id: "auth-password-input"
    commands:
      - takeScreenshot: "signup-passenger-blocked-existing-password-account"
      - assertNotVisible:
          id: "auth-password-input"

- runFlow:
    when:
      visible: "Código OTP obrigatório"
    commands:
      - tapOn: "OK"

- runFlow:
    when:
      visible: "Codigo OTP obrigatorio"
    commands:
      - tapOn: "OK"

- runFlow:
    when:
      visible:
        id: "auth-otp-digit-0"
    commands:
      - tapOn:
          id: "auth-otp-digit-0"
      - inputText: ${PASSENGER_OTP_DIGIT_0}
      - tapOn:
          id: "auth-otp-digit-1"
      - inputText: ${PASSENGER_OTP_DIGIT_1}
      - tapOn:
          id: "auth-otp-digit-2"
      - inputText: ${PASSENGER_OTP_DIGIT_2}
      - tapOn:
          id: "auth-otp-digit-3"
      - inputText: ${PASSENGER_OTP_DIGIT_3}
      - tapOn:
          id: "auth-otp-digit-4"
      - inputText: ${PASSENGER_OTP_DIGIT_4}
      - tapOn:
          id: "auth-otp-digit-5"
      - inputText: ${PASSENGER_OTP_DIGIT_5}
      - runFlow:
          when:
            visible:
              id: "auth-otp-verify-btn"
          commands:
            - tapOn:
                id: "auth-otp-verify-btn"

- extendedWaitUntil:
    visible:
      id: "auth-profile-option-customer"
    timeout: 90000
- tapOn:
    id: "auth-profile-option-customer"
- tapOn:
    id: "auth-profile-selection-continue-btn"

- extendedWaitUntil:
    visible:
      id: "auth-profile-full-name-input"
    timeout: 90000
- tapOn:
    id: "auth-profile-full-name-input"
- eraseText
- inputText: "QA Passageiro Signup"
- hideKeyboard
- tapOn:
    id: "auth-profile-legal-consent"
- tapOn:
    id: "auth-profile-submit"

- runFlow:
    when:
      visible: "Allow Leaf to access this device's location\\?"
    commands:
      - tapOn: "While using the app"

- runFlow:
    when:
      visible: "Allow Leaf to access this device’s location\\?"
    commands:
      - tapOn: "While using the app"

- runFlow:
    when:
      visible: "Permitir que a Leaf acesse a localização deste dispositivo\\?"
    commands:
      - tapOn: "Durante o uso do app"

- extendedWaitUntil:
    visible:
      id: "(passenger-home-destination-input|passenger-rating-screen|robotaxi-support-screen)"
    timeout: 120000

- takeScreenshot: "signup-passenger-success-home"
