appId: br.com.leaf.ride
---
- launchApp

- openLink: ${MAESTRO_METRO_URL_PASSENGER}

# Dismiss defensivo do Dev Menu (quando aparece sem árvore de acessibilidade)
- tapOn:
    point: "84%,58%"
- tapOn:
    point: "50%,87%"

- runFlow:
    when:
      visible: "Abrir com \".*Leaf.*\"\\?"
    commands:
      - tapOn: "Abrir"

- runFlow:
    when:
      visible: "Abrir"
    commands:
      - tapOn: "Abrir"

- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

- runFlow:
    when:
      visible: "Fitness"
    commands:
      - tapOn: "Leaf"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Buscar"
    commands:
      - tapOn: "Leaf"
      - waitForAnimationToEnd

# A home pode renderizar texto fora da árvore de acessibilidade em alguns ciclos.
# Em vez de falhar aqui, seguimos para os blocos condicionais abaixo.
- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Deseja Enviar Notificações.*"
    commands:
      - tapOn: "Não Permitir"

- runFlow:
    when:
      visible: "Sign in to view updates"
    commands:
      - tapOn: "Home"

- runFlow:
    when:
      visible: "http://.*:8081"
    commands:
      - tapOn: "http://.*:8081"

- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,32%"
      - tapOn: "http://.*"
      - eraseText
      - inputText: "http://${MAESTRO_METRO_HOST}:8081"
      - pressKey: Enter
      - runFlow:
          when:
            visible: "Connect"
          commands:
            - tapOn: "Connect"
      - runFlow:
          when:
            visible: "Abrir"
          commands:
            - tapOn: "Abrir"

- runFlow:
    when:
      visible: "No development servers found"
    commands:
      - tapOn: "Enter URL manually"
      - tapOn:
          point: "50%,32%"
      - tapOn: "http://.*"
      - eraseText
      - inputText: "http://${MAESTRO_METRO_HOST}:8081"
      - pressKey: Enter
      - runFlow:
          when:
            visible: "Connect"
          commands:
            - tapOn: "Connect"
      - runFlow:
          when:
            visible: "Abrir"
          commands:
            - tapOn: "Abrir"

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - tapOn:
          point: "88%,44%"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"

- runFlow:
    when:
      visible: "Permitir Enquanto Usa o App"
    commands:
      - tapOn: "Permitir Enquanto Usa o App"

- runFlow:
    when:
      visible:
        id: "auth-phone-input"
    commands:
      - tapOn:
          id: "auth-phone-input"
      - eraseText
      - inputText: "21102938475"
      - runFlow:
          when:
            visible: "Done"
          commands:
            - tapOn: "Done"
      - runFlow:
          when:
            visible: "Continuar"
          commands:
            - tapOn: "Continuar"
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"

- runFlow:
    when:
      visible: "Bem-vindo(a) à Leaf"
    commands:
      - tapOn: "Número"
      - eraseText
      - inputText: "21102938475"
      - runFlow:
          when:
            visible: "Done"
          commands:
            - tapOn: "Done"
      - runFlow:
          when:
            visible: "Continuar"
          commands:
            - tapOn: "Continuar"
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"

- runFlow:
    when:
      visible: "Verificação"
    commands:
      - tapOn:
          point: "17%,47%"
      - inputText: "9"
      - tapOn:
          point: "30%,47%"
      - inputText: "9"
      - tapOn:
          point: "43%,47%"
      - inputText: "2"
      - tapOn:
          point: "56%,47%"
      - inputText: "1"
      - tapOn:
          point: "69%,47%"
      - inputText: "1"
      - tapOn:
          point: "82%,47%"
      - inputText: "1"
      - runFlow:
          when:
            visible: "Verificar"
          commands:
            - tapOn: "Verificar"
      - runFlow:
          when:
            visible: "Verify"
          commands:
            - tapOn: "Verify"
      - extendedWaitUntil:
          notVisible: "Verificação"
          timeout: 45000

- runFlow:
    when:
      visible: "Como você quer usar a Leaf?"
    commands:
      - tapOn: "Quero viajar"
      - tapOn: "Continuar"

- runFlow:
    when:
      visible: "Quero viajar"
    commands:
      - tapOn: "Quero viajar"
      - tapOn: "Continuar"

- runFlow:
    when:
      visible: "Complete seu e-mail"
    commands:
      - tapOn: "Depois"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"

- runFlow:
    when:
      visible: "Permitir Enquanto Usa o App"
    commands:
      - tapOn: "Permitir Enquanto Usa o App"

- extendedWaitUntil:
    notVisible: "Ativação pendente"
    timeout: 90000

- takeScreenshot: "e2e-passenger-01-home"
