appId: br.com.leaf.ride
env:
  PASSENGER_PHONE: "21102938475"
  TEST_OTP: "992111"
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Fitness"
    commands:
      - tapOn: "Leaf"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*(DEVELOPMENT SERVERS|Sign in to view updates|No development servers found|Bem-vindo.*Leaf|Número|Verificação|Como você quer usar a Leaf\\?|Quero viajar|Para onde vamos\\?|Ganhos de hoje|Ficar Online|Ficar Offline|Ativação pendente).*"
    timeout: 120000

- runFlow:
    when:
      visible: ".*Deseja Enviar Notificações.*"
    commands:
      - tapOn: "Não Permitir"

- runFlow:
    when:
      visible: "Sign in to view updates"
    commands:
      - tapOn: "Home"

- runFlow:
    when:
      visible: "http://.*:8081"
    commands:
      - tapOn: "http://.*:8081"

- runFlow:
    when:
      visible: "No development servers found"
    commands:
      - tapOn: "Enter URL manually"
      - inputText: "http://localhost:8081"
      - pressKey: Enter
      - runFlow:
          when:
            visible: "Connect"
          commands:
            - tapOn: "Connect"
      - runFlow:
          when:
            visible: "Abrir"
          commands:
            - tapOn: "Abrir"

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - tapOn:
          point: "88%,44%"

- extendedWaitUntil:
    visible: ".*(Bem-vindo.*Leaf|Número|Verificação|Como você quer usar a Leaf\\?|Quero viajar|Para onde vamos\\?|Ganhos de hoje|Ficar Online|Ficar Offline|Ativação pendente).*"
    timeout: 90000

- runFlow:
    when:
      visible:
        id: "auth-phone-input"
    commands:
      - tapOn:
          id: "auth-phone-input"
      - eraseText
      - inputText: ${PASSENGER_PHONE}
      - tapOn: "Done"

- runFlow:
    when:
      visible: "Bem-vindo.*Leaf"
    commands:
      - tapOn:
          id: "auth-phone-input"
      - eraseText
      - inputText: ${PASSENGER_PHONE}
      - tapOn: "Done"

- runFlow:
    when:
      visible: "Verificação"
    commands:
      - inputText: ${TEST_OTP}
      - extendedWaitUntil:
          notVisible: "Verificação"
          timeout: 30000

- runFlow:
    when:
      visible: "Como você quer usar a Leaf?"
    commands:
      - tapOn: "Quero viajar"
      - tapOn: "Continuar"

- runFlow:
    when:
      visible: "Quero viajar"
    commands:
      - tapOn: "Quero viajar"
      - tapOn: "Continuar"

- runFlow:
    when:
      visible: "Complete seu e-mail"
    commands:
      - tapOn: "Depois"
      - waitForAnimationToEnd

- waitForAnimationToEnd
- takeScreenshot: "qa-passenger-01-home"

- tapOn:
    point: "10%,11%"
- waitForAnimationToEnd

- tapOn:
    point: "50%,94%"
- waitForAnimationToEnd

- waitForAnimationToEnd
- tapOn:
    point: "50%,87%"

- waitForAnimationToEnd
- takeScreenshot: "qa-passenger-02-destination-search"

- tapOn:
    point: "26%,57%"

- waitForAnimationToEnd
- takeScreenshot: "qa-passenger-03-quote"

- tapOn:
    point: "50%,89%"

- runFlow:
    when:
      visible: "Pagamento PIX"
    commands:
      - takeScreenshot: "qa-passenger-04-payment-modal"

- runFlow:
    when:
      visible: "Gerando cobrança PIX..."
    commands:
      - takeScreenshot: "qa-passenger-04-payment-loading"
