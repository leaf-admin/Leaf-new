appId: br.com.leaf.ride
---
- launchApp

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - tapOn:
          point: "88%,44%"

- waitForAnimationToEnd
- takeScreenshot: "probe-home-01-initial"

- tapOn:
    point: "10%,11%"
- waitForAnimationToEnd
- takeScreenshot: "probe-home-02-after-back"

- tapOn:
    point: "50%,94%"
- waitForAnimationToEnd
- takeScreenshot: "probe-home-03-after-home-tab"

- tapOn:
    point: "89%,11%"
- waitForAnimationToEnd
- takeScreenshot: "probe-home-04-after-top-right"
