appId: br.com.leaf.ride
env:
  DRIVER_PHONE: "21123456789"
  TEST_OTP: "992000"
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Fitness"
    commands:
      - tapOn: "Leaf"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*(DEVELOPMENT SERVERS|Sign in to view updates|No development servers found|Bem-vindo.*Leaf|Número|Verificação|Como você quer usar a Leaf\\?|Quero ser parceiro|Ganhos de hoje|Ficar Online|Ficar Offline|Ativação pendente).*"
    timeout: 120000

- runFlow:
    when:
      visible: ".*Deseja Enviar Notificações.*"
    commands:
      - tapOn: "Não Permitir"

- runFlow:
    when:
      visible: "Sign in to view updates"
    commands:
      - tapOn: "Home"

- runFlow:
    when:
      visible: "http://.*:8081"
    commands:
      - tapOn: "http://.*:8081"

- runFlow:
    when:
      visible: "No development servers found"
    commands:
      - tapOn: "Enter URL manually"
      - inputText: "http://localhost:8081"
      - pressKey: Enter
      - runFlow:
          when:
            visible: "Connect"
          commands:
            - tapOn: "Connect"
      - runFlow:
          when:
            visible: "Abrir"
          commands:
            - tapOn: "Abrir"

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - tapOn:
          point: "88%,44%"

- extendedWaitUntil:
    visible: ".*(Bem-vindo.*Leaf|Número|Verificação|Como você quer usar a Leaf\\?|Quero ser parceiro|Ganhos de hoje|Ficar Online|Ficar Offline|Ativação pendente).*"
    timeout: 90000

- runFlow:
    when:
      visible:
        id: "auth-phone-input"
    commands:
      - tapOn:
          id: "auth-phone-input"
      - eraseText
      - inputText: ${DRIVER_PHONE}
      - tapOn: "Done"

- runFlow:
    when:
      visible: "Bem-vindo.*Leaf"
    commands:
      - tapOn:
          id: "auth-phone-input"
      - eraseText
      - inputText: ${DRIVER_PHONE}
      - tapOn: "Done"

- runFlow:
    when:
      visible: "Verificação"
    commands:
      - inputText: ${TEST_OTP}
      - extendedWaitUntil:
          notVisible: "Verificação"
          timeout: 30000

- runFlow:
    when:
      visible: "Como você quer usar a Leaf?"
    commands:
      - tapOn: "Quero ser parceiro"
      - tapOn: "Continuar"

- runFlow:
    when:
      visible: "Quero ser parceiro"
    commands:
      - tapOn: "Quero ser parceiro"
      - tapOn: "Continuar"

- runFlow:
    when:
      visible: "Complete seu e-mail"
    commands:
      - tapOn: "Depois"
      - waitForAnimationToEnd

- waitForAnimationToEnd
- takeScreenshot: "qa-driver-01-home"

- extendedWaitUntil:
    visible: ".*(Ganhos de hoje|Ficar Online|Ficar Offline|Ativação pendente).*"
    timeout: 30000

- takeScreenshot: "qa-driver-02-panel"

- runFlow:
    when:
      visible: ".*Concluir ativação.*"
    commands:
      - tapOn: ".*Concluir ativação.*"

- runFlow:
    when:
      visible: ".*Ativação do motorista.*"
    commands:
      - takeScreenshot: "qa-driver-03-activation"
