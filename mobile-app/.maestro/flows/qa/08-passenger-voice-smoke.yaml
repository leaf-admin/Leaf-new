appId: br.com.leaf.ride
env:
  TEST_PHONE: "21102938475"
  TEST_OTP: "992111"
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
      - runFlow:
          when:
            visible: "Abrir"
          commands:
            - tapOn: "Abrir"

- runFlow:
    when:
      visible: "Abrir"
    commands:
      - tapOn: "Abrir"

- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - tapOn:
          point: "88%,44%"

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "auth-phone-input"
    timeout: 30000

- tapOn:
    id: "auth-phone-input"
- eraseText
- inputText: ${TEST_PHONE}
- pressKey: Enter

- runFlow:
    when:
      visible: "Verificação"
    commands:
      - inputText: ${TEST_OTP}
      - extendedWaitUntil:
          notVisible: "Verificação"
          timeout: 30000

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Para onde vamos?"
    timeout: 30000

- tapOn:
    point: "86%,81%"

- runFlow:
    when:
      visible: "Permissão necessária"
    commands:
      - tapOn: "OK"

- runFlow:
    when:
      visible: "Busca por voz"
    commands:
      - tapOn: "OK"

- waitForAnimationToEnd
- takeScreenshot: "ios-passenger-voice-smoke"
