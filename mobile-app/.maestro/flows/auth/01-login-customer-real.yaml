appId: br.com.leaf.ride
env:
  FIREBASE_TEST_PHONE: "21102938475"
  FIREBASE_TEST_OTP: "992111"
  EXISTING_ACCOUNT_PASSWORD: "Leaf@Review2026!"
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Abrir"
    commands:
      - tapOn: "Abrir"

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Sign in to view updates"
    commands:
      - tapOn: "Home"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "http://10.0.2.2:8081"
    commands:
      - tapOn: "http://10.0.2.2:8081"
      - waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "(auth-phone-input|auth-password-input|auth-otp-digit-0|passenger-home-destination-input)"
    commands:
      - extendedWaitUntil:
          visible: "http://10.0.2.2:8081"
          timeout: 45000
      - tapOn: "http://10.0.2.2:8081"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Go home"
          commands:
            - tapOn: "Go home"
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - runFlow:
          when:
            visible: "This is the developer menu"
          commands:
            - tapOn: "Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "(auth-phone-input|auth-password-input|auth-otp-digit-0|passenger-home-destination-input)"
    timeout: 90000

- runFlow:
    when:
      visible:
        id: "auth-phone-input"
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: "auth-phone-input"
      - eraseText
      - inputText: ${FIREBASE_TEST_PHONE}

      - runFlow:
          when:
            visible: "Ja tenho senha"
          commands:
            - tapOn: "Ja tenho senha"
            - waitForAnimationToEnd

      - runFlow:
          when:
            visible: "Já tenho senha"
          commands:
            - tapOn: "Já tenho senha"
            - waitForAnimationToEnd

      - runFlow:
          when:
            visible: "Código OTP obrigatório"
          commands:
            - tapOn: "OK"
            - waitForAnimationToEnd

      - runFlow:
          when:
            visible: "Codigo OTP obrigatorio"
          commands:
            - tapOn: "OK"
            - waitForAnimationToEnd

      - runFlow:
          when:
            visible:
              id: "auth-password-input"
          commands:
            - tapOn:
                id: "auth-password-input"
            - eraseText
            - inputText: ${EXISTING_ACCOUNT_PASSWORD}
            - swipe:
                start: "50%,82%"
                end: "50%,34%"

      - runFlow:
          when:
            visible:
              id: "auth-continue-btn"
          commands:
            - tapOn:
                id: "auth-continue-btn"

      - runFlow:
          when:
            notVisible:
              id: "auth-continue-btn"
          commands:
            - pressKey: Enter

      - waitForAnimationToEnd

      - runFlow:
          when:
            visible:
              id: "auth-otp-digit-0"
          commands:
            - tapOn:
                id: "auth-otp-digit-0"
            - inputText: ${FIREBASE_TEST_OTP}
            - runFlow:
                when:
                  visible:
                    id: "auth-otp-verify-btn"
                commands:
                  - tapOn:
                      id: "auth-otp-verify-btn"
            - extendedWaitUntil:
                notVisible:
                  id: "auth-otp-digit-0"
                timeout: 45000
            - waitForAnimationToEnd

      - runFlow:
          when:
            visible: "Como você quer usar a Leaf?"
          commands:
            - tapOn: "Quero viajar"
            - tapOn: "Continuar"

      - runFlow:
          when:
            visible: "Quero viajar"
          commands:
            - tapOn: "Quero viajar"
            - tapOn: "Continuar"

      - runFlow:
          when:
            visible: "Nome completo"
          commands:
            - inputText: "Teste Firebase Sandbox"
            - tapOn: "CPF"
            - inputText: "12345678901"
            - tapOn: "Cadastrar"

      - runFlow:
          when:
            visible: "Allow Leaf to access this device’s location\\?"
          commands:
            - tapOn: "While using the app"

      - runFlow:
          when:
            visible: "Permitir que a Leaf acesse a localização deste dispositivo\\?"
          commands:
            - tapOn: "Durante o uso do app"

      - runFlow:
          when:
            visible: "Permitir que o app Leaf acesse a localização deste dispositivo\\?"
          commands:
            - tapOn: "Durante o uso do app"

      - runFlow:
          when:
            visible: "Permitir apenas desta vez"
          commands:
            - tapOn: "Permitir apenas desta vez"

- runFlow:
    when:
      visible:
        id: "auth-phone-input"
    commands:
      - takeScreenshot: "auth-stuck-login-screen"

- assertNotVisible:
    id: "auth-phone-input"

- extendedWaitUntil:
    visible:
      id: "(passenger-home-destination-input|passenger-rating-screen|robotaxi-support-screen)"
    timeout: 90000

- runFlow:
    when:
      visible:
        id: "passenger-home-destination-input"
    commands:
      - assertVisible:
          id: "passenger-home-destination-input"

- runFlow:
    when:
      visible:
        id: "passenger-rating-screen"
    commands:
      - assertVisible:
          id: "passenger-rating-screen"

- runFlow:
    when:
      visible:
        id: "robotaxi-support-screen"
    commands:
      - assertVisible:
          id: "robotaxi-support-screen"

- runFlow:
    when:
      visible: "Confirme sua viagem"
    commands:
      - assertVisible: "Confirme sua viagem"

- runFlow:
    when:
      visible: "Avalie a viagem"
    commands:
      - assertVisible: "Avalie a viagem"

- runFlow:
    when:
      visible: "Suporte"
    commands:
      - assertVisible: "Suporte"

- takeScreenshot: "auth-firebase-sandbox-login-success"
