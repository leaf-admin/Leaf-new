appId: br.com.leaf.ride
env:
  DRIVER_PHONE: "21123456789"
  DRIVER_OTP: "992000"
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Abrir"
    commands:
      - tapOn: "Abrir"

- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- extendedWaitUntil:
    visible:
      id: "(auth-phone-input|driver-home-toggle-online)"
    timeout: 120000

- runFlow:
    when:
      visible:
        id: "auth-phone-input"
    commands:
      - tapOn:
          id: "auth-phone-input"
      - eraseText
      - inputText: ${DRIVER_PHONE}
      - pressKey: Back
      - waitForAnimationToEnd
      - tapOn:
          id: "auth-continue-btn"

- runFlow:
    when:
      visible:
        id: "auth-otp-digit-0"
    commands:
      - tapOn:
          id: "auth-otp-digit-0"
      - inputText: ${DRIVER_OTP}
      - runFlow:
          when:
            visible:
              id: "auth-otp-verify-btn"
          commands:
            - tapOn:
                id: "auth-otp-verify-btn"

- runFlow:
    when:
      visible:
        id: "auth-profile-selection-trigger"
    commands:
      - tapOn:
          id: "auth-profile-selection-trigger"
      - tapOn:
          id: "auth-profile-option-driver"
      - tapOn:
          id: "auth-profile-selection-continue-btn"

- runFlow:
    when:
      visible:
        id: "driver-email-skip-btn"
    commands:
      - tapOn:
          id: "driver-email-skip-btn"

- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"

- runFlow:
    when:
      visible: "Permitir Enquanto Usa o App"
    commands:
      - tapOn: "Permitir Enquanto Usa o App"

- extendedWaitUntil:
    visible: ".*(driver-home-toggle-online|Ficar Online|Ficar online|Ficar Offline|Ficar offline|Concluir ativação|Concluir ativacao|Ativação pendente).*"
    timeout: 120000

- takeScreenshot: "driver-login-home-ready"
