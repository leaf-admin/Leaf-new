appId: br.com.leaf.ride
env:
  TEST_PHONE: "11999999999"
  TEST_OTP: "000000"
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: ".*Deseja Enviar Notificações.*"
    commands:
      - tapOn: "Não Permitir"

- runFlow:
    when:
      visible: "Sign in to view updates"
    commands:
      - tapOn: "Home"

- runFlow:
    when:
      visible: "http://.*:8081"
    commands:
      - tapOn: "http://.*:8081"

- runFlow:
    when:
      visible: "http://.*:8081"
    commands:
      - tapOn: "http://.*:8081"
      - runFlow:
          when:
            visible: "Abrir"
          commands:
            - tapOn: "Abrir"

- runFlow:
    when:
      visible: "No development servers found"
    commands:
      - tapOn: "Enter URL manually"
      - inputText: "http://localhost:8081"
      - pressKey: Enter
      - runFlow:
          when:
            visible: "Connect"
          commands:
            - tapOn: "Connect"
      - runFlow:
          when:
            visible: "Abrir"
          commands:
            - tapOn: "Abrir"

- runFlow:
    when:
      visible: "Abrir"
    commands:
      - tapOn: "Abrir"

- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - tapOn:
          point: "88%,44%"

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "auth-phone-input"
    timeout: 30000

- tapOn:
    id: "auth-phone-input"
- eraseText
- inputText: ${TEST_PHONE}
- pressKey: Enter

- runFlow:
    when:
      visible: "Verificação"
    commands:
      - inputText: ${TEST_OTP}
      - extendedWaitUntil:
          notVisible: "Verificação"
          timeout: 30000

- runFlow:
    when:
      visible: "Como você quer usar a Leaf?"
    commands:
      - tapOn: "Quero viajar"
      - tapOn: "Continuar"

- runFlow:
    when:
      visible: "Quero viajar"
    commands:
      - tapOn: "Quero viajar"
      - tapOn: "Continuar"

- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- waitForAnimationToEnd

- takeScreenshot: "ios-auth-login-success"
