appId: br.com.leaf.ride
---
# Fluxo novo de cadastro abre na tela de boas-vindas ("Seu app local"); toca em Começar quando ela aparece.
- runFlow:
    when:
      visible:
        id: "onboarding-welcome-start"
    commands:
      - tapOn:
          id: "onboarding-welcome-start"
      - extendedWaitUntil:
          visible:
            id: "auth-phone-input"
          timeout: 30000
