# Teste Real: Solicitar Corrida Completa
# Baseado na NewMapScreen.js
appId: br.com.leaf.ride
---
# Assumindo que ja esta logado como customer
- assertNotVisible:
    id: "auth-phone-input"

- runFlow:
    when:
      notVisible:
        id: "passenger-home-destination-input"
    commands:
      - swipe:
          start: "50%,95%"
          end: "50%,72%"
      - waitForAnimationToEnd
      - tapOn:
          point: "50%,88%"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "passenger-home-destination-input"
    timeout: 90000
- takeScreenshot: "01-home-ready"

- tapOn:
    id: "passenger-home-destination-input"
- extendedWaitUntil:
    visible:
      id: "passenger-destination-search-input"
    timeout: 45000
- takeScreenshot: "02-destination-sheet-open"

- tapOn:
    id: "passenger-destination-search-input"
- eraseText
- inputText: "Aeroporto Santos Dumont"
- waitForAnimationToEnd
- takeScreenshot: "03-destination-typed"

- runFlow:
    when:
      visible:
        id: "passenger-destination-result-0"
    commands:
      - tapOn:
          id: "passenger-destination-result-0"
- runFlow:
    when:
      visible: "Aeroporto Santos Dumont"
    commands:
      - tapOn: "Aeroporto Santos Dumont"

- extendedWaitUntil:
    visible:
      id: "passenger-destination-confirm-button"
    timeout: 45000
- tapOn:
    id: "passenger-destination-confirm-button"
- waitForAnimationToEnd
- takeScreenshot: "04-booking-request-submitted"

- runFlow:
    when:
      visible:
        id: "payment-modal-confirmed"
    commands:
      - takeScreenshot: "05-payment-confirmed"

- runFlow:
    when:
      visible: "Realize seu pagamento"
    commands:
      - takeScreenshot: "05-payment-required"

- runFlow:
    when:
      visible: "Gerando cobrança PIX..."
    commands:
      - takeScreenshot: "05-payment-generating"

- runFlow:
    when:
      visible:
        id: "passenger-driver-search-elapsed"
    commands:
      - takeScreenshot: "06-driver-search"

- assertVisible: ".*(Procurando motorista|Realize seu pagamento|Gerando cobrança PIX...|Categoria indisponível|Nao há motoristas disponíveis|Não há motoristas disponíveis).*"
