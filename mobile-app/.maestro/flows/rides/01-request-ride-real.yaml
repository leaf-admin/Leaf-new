# Teste Real: Solicitar Corrida Completa (estado resiliente)
appId: br.com.leaf.ride
---
- assertNotVisible:
    id: "auth-phone-input"

# Limpeza leve de overlays que bloqueiam a interação com home
- runFlow:
    when:
      notVisible:
        id: "passenger-home-destination-input"
    commands:
      - runFlow:
          when:
            visible: "Avalie a viagem"
          commands:
            - pressKey: Back
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Suporte"
          commands:
            - pressKey: Back
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible: "Para onde vamos\\?"
          commands:
            - tapOn:
                point: "50%,93%"
            - waitForAnimationToEnd

# Caminho principal: iniciar da home
- runFlow:
    when:
      visible:
        id: "passenger-home-destination-input"
    commands:
      - takeScreenshot: "01-home-ready"
      - tapOn:
          id: "passenger-home-destination-input"
      - extendedWaitUntil:
          visible:
            id: "passenger-destination-search-input"
          timeout: 45000
      - takeScreenshot: "02-destination-sheet-open"

      - tapOn:
          id: "passenger-destination-search-input"
      - eraseText
      - inputText: "Copacabana Palace"
      - waitForAnimationToEnd
      - takeScreenshot: "03-destination-typed"

      - runFlow:
          when:
            visible:
              id: "passenger-destination-result-0"
          commands:
            - tapOn:
                id: "passenger-destination-result-0"
      - tapOn:
          point: "50%,47%"
          optional: true

      - extendedWaitUntil:
          visible:
            id: "passenger-destination-confirm-button"
          timeout: 45000
      - tapOn:
          id: "passenger-destination-confirm-button"
      - waitForAnimationToEnd
      - takeScreenshot: "04-booking-request-submitted"

# Caminho alternativo (UI atual): busca por destino via campo textual
- runFlow:
    when:
      visible: "Para onde vamos\\?"
    commands:
      - takeScreenshot: "01-home-ready"
      - tapOn: "Para onde vamos?"
      - extendedWaitUntil:
          visible: "Para onde você quer ir\\?"
          timeout: 45000
      - takeScreenshot: "02-destination-sheet-open"
      - tapOn: "Para onde você quer ir?"
      - eraseText
      - inputText: "Copacabana Palace"
      - waitForAnimationToEnd
      - takeScreenshot: "03-destination-typed"
      - tapOn:
          point: "50%,73%"
      - waitForAnimationToEnd
      - takeScreenshot: "04-booking-request-submitted"

# Caminho alternativo: já iniciou no card de confirmação da corrida
- runFlow:
    when:
      visible: "Confirme sua viagem"
    commands:
      - takeScreenshot: "04-booking-request-existing-state"

- runFlow:
    when:
      visible:
        id: "payment-modal-confirmed"
    commands:
      - takeScreenshot: "05-payment-confirmed"

- runFlow:
    when:
      visible: "Realize seu pagamento"
    commands:
      - takeScreenshot: "05-payment-required"

- runFlow:
    when:
      visible: "Gerando cobrança PIX..."
    commands:
      - takeScreenshot: "05-payment-generating"

- runFlow:
    when:
      visible:
        id: "passenger-driver-search-elapsed"
    commands:
      - takeScreenshot: "06-driver-search"

- runFlow:
    when:
      visible: "Região indisponível"
    commands:
      - takeScreenshot: "05-region-unavailable"

- runFlow:
    when:
      visible: "Regiao indisponivel"
    commands:
      - takeScreenshot: "05-region-unavailable-no-accent"

- assertVisible: ".*(Procurando motorista|Procurando motoristas|Realize seu pagamento|Gerando cobrança PIX...|Categoria indisponível|Categoria indisponivel|Nao há motoristas disponíveis|Não há motoristas disponíveis|Nao ha motoristas disponiveis|Indisponível|Destino fora da area de cobertura da Leaf|Confirme sua viagem).*"

- assertNotVisible: "Origem e destino inconsistentes para a área de operação da Leaf"
