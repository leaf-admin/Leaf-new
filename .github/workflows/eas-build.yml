name: Leaf Release Gate

on:
  pull_request:
    paths:
      - 'leaf-websocket-backend/**'
      - 'mobile-app/**'
      - 'leaf-dashboard-js/**'
      - 'observability/**'
      - 'docker-compose.observability.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/maintenance/security/**'
      - 'scripts/validation/**'
      - 'scripts/tests/firestore-rules-emulator.cjs'
      - 'scripts/tests/firebase-rtdb-storage-rules-emulator.cjs'
      - 'config/firebase/**'
      - 'services/support-agent-orchestrator/package.json'
      - 'AGENTS.md'
      - 'PROJECT_RULES.md'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma para compilar (android, ios, all)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'Perfil de build'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - production-apk
          - preview
          - development

jobs:
  validate-backend:
    name: Backend Tests And Runtime Config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./leaf-websocket-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate production runtime guard
        env:
          NODE_ENV: production
          WOOVI_ENVIRONMENT: production
          WOOVI_BASE_URL: https://api.woovi.com
          WOOVI_API_TOKEN: ci-token-placeholder
          WOOVI_WEBHOOK_SIGNATURE_SECRET: ci-webhook-secret-placeholder
          WOOVI_WEBHOOK_REQUIRE_SIGNATURE: 'true'
          WOOVI_WEBHOOK_ALLOW_UNSIGNED: 'false'
          LEAF_PIX_KEY: ci-pix-key-placeholder
          CORS_ORIGIN: https://api.leaf.app.br
          APP_REVIEW: 'false'
          BYPASS_GEOFENCE: 'false'
          GEOFENCE_RADIUS_KM: '25'
          ENABLE_MANUAL_PAYMENT_CONFIRMATION: 'false'
          ENABLE_DASHBOARD_MOCK_ENDPOINTS: 'false'
          ENABLE_PAYMENT_BYPASS_ON_WOOVI_FAILURE: 'false'
          FORCE_PAYMENT_BYPASS: 'false'
          ALLOW_NGROK_CORS: 'false'
          ALLOW_PRIVATE_CORS: 'false'
          LEAF_LAUNCH_PROFILE: pilot_controlled
          LEAF_PILOT_CONTROLLED: 'true'
          PILOT_ALLOWED_PASSENGER_IDS: ci-passenger-1
          PILOT_ALLOWED_DRIVER_IDS: ci-driver-1
          PILOT_REGION_IDS: rio-pilot-ci
          LEAF_ACCEPT_NEW_PIX: 'true'
          LEAF_ACCEPT_NEW_BOOKINGS: 'true'
          LEAF_RUNTIME_POLICY_VERSION: ci-pilot-policy-v1
          GEOFENCE_FAIL_CLOSED: 'true'
          GEOFENCE_REQUIRE_DESTINATION_INSIDE_REGION: 'true'
          GEOFENCE_REGION_FILE: config/geofence.json
          LEAF_APPROVED_FINANCIAL_POLICY_ID: runtime_tiered_percent_above_50_v1
          LEAF_FINANCIAL_POLICY_APPROVAL_REF: ci-contract-check
          KYC_PRODUCTION_BIOMETRICS_ENABLED: 'true'
          KYC_STRICT_PRODUCTION_MODE: 'true'
          KYC_AWS_LIVENESS_ENABLED: 'true'
          KYC_AWS_LIVENESS_CREDENTIALS_ENABLED: 'true'
          KYC_AWS_LIVENESS_ASSUME_ROLE_ARN: arn:aws:iam::000000000000:role/ci-leaf-liveness
          KYC_AWS_LIVENESS_ASSUME_ROLE_EXTERNAL_ID: ci-liveness-external-binding
          KYC_AWS_LIVENESS_STS_SESSION_NAME_PREFIX: leaf-liveness
          KYC_AWS_CREDENTIAL_SOURCE: ambient
          KYC_AWS_COST_GUARD_ENABLED: 'true'
          KYC_AWS_COST_PER_USER_DAILY_SESSION_LIMIT: '20'
          KYC_AWS_COST_TIME_ZONE: UTC
          KYC_AWS_ADMISSION_CONTROL_ENABLED: 'true'
          KYC_AWS_ADMISSION_CREATE_TPS: '20'
          KYC_AWS_ADMISSION_CREATE_BURST: '20'
          KYC_AWS_ADMISSION_RESULT_TPS: '20'
          KYC_AWS_ADMISSION_RESULT_BURST: '20'
          KYC_AWS_ADMISSION_MAX_CONCURRENT_SESSIONS: '70'
          KYC_AWS_ADMISSION_LEASE_TTL_SECONDS: '180'
          KYC_AWS_ADMISSION_MAX_WAIT_MS: '15000'
          DAILY_KYC_ONLINE_GATE_ENABLED: 'true'
          KYC_TRUST_CADENCE_ENABLED: 'true'
          KYC_ACTIVE_TRIP_AUTHORITY_MODE: redis_noeviction
          ENABLE_TRIP_LOCATION_STREAM: 'true'
          REDIS_CRITICAL_AUTHORITY_ATTESTATION_ENABLED: 'true'
          REDIS_CRITICAL_DATASET_QUARANTINE_ENABLED: 'true'
          REDIS_CRITICAL_DATASET_GENERATION: ci-runtime-generation-v1
          BIOMETRIC_FACE_SERVICE_URL: https://face.invalid.local
          BIOMETRIC_FACE_SERVICE_API_KEY: ci-face-key-placeholder
          ENABLE_CNH_FACE_BIOMETRICS: 'true'
          MOBILE_FACE_EMBEDDING_ENABLED: 'false'
          KYC_REQUIRE_TRUSTED_BIOMETRIC_MATCH: 'true'
          KYC_ALLOW_LEGACY_DEVICE_SIGNATURE: 'false'
          KYC_ALLOW_AWS_LIVENESS_ONLY_MATCH: 'false'
          MOBILE_FACE_EMBEDDING_LOCAL_COMPARE_FALLBACK: 'false'
        run: npm run config:validate

      - name: Validate versioned pilot geofence matrix
        run: npm run qa:geofence-pilot

      - name: Assert backend architecture contracts
        run: npm run test:architecture

      - name: Run backend unit tests
        run: npm run test:unit

      - name: Run backend integration tests
        run: npm run test:integration

  validate-mobile:
    name: Mobile Production Guards And Full Unit Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Assert mobile production guards
        run: npm run qa:production-guards

      - name: Run full mobile unit suite
        run: npm run test:unit -- --runInBand

  validate-dashboard:
    name: Dashboard Lint Build And Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./leaf-dashboard-js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run dashboard quality gate
        run: npm run qa:backoffice

  validate-workspace-safety:
    name: Governance And Secret Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate governance contract
        run: npm run governance:check

      - name: Validate package script entrypoints
        run: npm run package-scripts:check

      - name: Validate production observability invariants
        run: npm run observability:validate

      - name: Scan tracked workspace files
        run: node scripts/maintenance/security/scan-secrets.cjs --tracked-only

      - name: Assert no hardcoded backend secrets
        run: bash leaf-websocket-backend/scripts/tests/assert-no-hardcoded-secrets.sh

  validate-firebase-rules:
    name: Firebase Rules Release And Emulator Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical Firebase rules release
        run: npm run firebase:rules:check

      - name: Run Firebase rules emulators
        run: npm run test:firebase:rules

  eas-build:
    name: Manual EAS Build
    runs-on: ubuntu-latest
    needs:
      - validate-backend
      - validate-mobile
      - validate-dashboard
      - validate-workspace-safety
      - validate-firebase-rules
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Setup Expo And EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build With EAS
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          PROFILE="${{ github.event.inputs.profile }}"
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
