name: Leaf Release Gate

on:
  pull_request:
    paths:
      - 'leaf-websocket-backend/**'
      - 'mobile-app/**'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma para compilar (android, ios, all)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'Perfil de build'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - production-apk
          - preview
          - development

jobs:
  validate-backend:
    name: Backend Tests And Runtime Config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./leaf-websocket-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './leaf-websocket-backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate production runtime guard
        env:
          NODE_ENV: production
          WOOVI_ENVIRONMENT: production
          WOOVI_BASE_URL: https://api.woovi.com
          WOOVI_API_TOKEN: ci-token-placeholder
          WOOVI_WEBHOOK_SIGNATURE_SECRET: ci-webhook-secret-placeholder
          WOOVI_WEBHOOK_REQUIRE_SIGNATURE: 'true'
          WOOVI_WEBHOOK_ALLOW_UNSIGNED: 'false'
          LEAF_PIX_KEY: ci-pix-key-placeholder
          CORS_ORIGIN: https://api.62.169.31.231.sslip.io
          APP_REVIEW: 'false'
          BYPASS_GEOFENCE: 'false'
          GEOFENCE_RADIUS_KM: '25'
          ENABLE_MANUAL_PAYMENT_CONFIRMATION: 'false'
          ENABLE_DASHBOARD_MOCK_ENDPOINTS: 'false'
          ENABLE_PAYMENT_BYPASS_ON_WOOVI_FAILURE: 'false'
          FORCE_PAYMENT_BYPASS: 'false'
          ALLOW_NGROK_CORS: 'false'
          ALLOW_PRIVATE_CORS: 'false'
        run: npm run config:validate

      - name: Assert sensitive route guards
        run: npm run test:route-guards

      - name: Run backend unit tests
        run: npm run test:unit

      - name: Run backend integration tests
        run: npm run test:integration

  validate-mobile:
    name: Mobile Production Guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './mobile-app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Assert mobile production guards
        run: npm run qa:production-guards

      - name: Run focused mobile auth tests
        run: npx jest --config jest.config.js __tests__/phone-input-step.auth.test.js __tests__/otp-step.auth.test.js __tests__/auth-flow.recovery.test.js --runInBand

  eas-build:
    name: Manual EAS Build
    runs-on: ubuntu-latest
    needs:
      - validate-backend
      - validate-mobile
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './mobile-app/package-lock.json'

      - name: Setup Expo And EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build With EAS
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          PROFILE="${{ github.event.inputs.profile }}"
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
