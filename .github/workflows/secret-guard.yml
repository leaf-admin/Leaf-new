name: Secret Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hardcoded secret guard
        run: bash leaf-websocket-backend/scripts/tests/assert-no-hardcoded-secrets.sh

      - name: Run workspace security scan
        run: npm run security:scan
